<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sokoban 50關：完美解鎖修復版</title>
    <style>
        :root { --bg: #0f172a; --wall: #475569; --box: #f59e0b; --target: #3b82f6; --win: #22c55e; --cell: 45px; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        .header { width: 100%; padding: 10px; display: flex; justify-content: space-around; align-items: center; background: #1e293b; border-bottom: 2px solid #3b82f6; }
        #game-board { margin: 20px auto; padding: 10px; background: #1e293b; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .row { display: flex; }
        .cell { width: var(--cell); height: var(--cell); display: flex; align-items: center; justify-content: center; font-size: 24px; position: relative; }
        .wall { background: var(--wall); border-radius: 4px; border: 1px solid #64748b; }
        .target { background: radial-gradient(circle, var(--target) 20%, transparent 25%); }
        .box { background: var(--box); border-radius: 8px; border: 2px solid #92400e; z-index: 2; width: 85%; height: 85%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #78350f; }
        .box-ok { background: var(--win) !important; border-color: #166534 !important; box-shadow: 0 4px 0 #064e3b !important; }
        .player { z-index: 3; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5)); }
        .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .btn-s { background: #3b82f6; padding: 12px 24px; border-radius: 8px; border: none; color: #fff; font-weight: bold; cursor: pointer; }
        .lv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 20px; }
        .lv-item { width: 50px; height: 50px; background: #334155; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: not-allowed; opacity: 0.3; }
        .lv-item.unlocked { cursor: pointer; opacity: 1; background: #3b82f6; box-shadow: 0 4px 0 #1d4ed8; }
        .controls { margin-top: auto; padding-bottom: 30px; }
        .dpad { display: grid; grid-template-columns: repeat(3, 75px); grid-template-rows: repeat(2, 65px); gap: 12px; }
        .btn-ctrl { background: #1e293b; color: white; border: 2px solid #475569; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 5px 0 #000; }
    </style>
</head>
<body>

<div class="header">
    <button class="btn-s" style="background:#475569" onclick="openMenu()">關卡</button>
    <div style="font-weight: bold;">LEVEL <span id="lv-num">1</span></div>
    <button class="btn-s" style="background:#e11d48" onclick="resetLevel()">重設 (R)</button>
</div>

<div id="game-board"><div id="main-grid"></div></div>

<div id="win-screen" class="overlay">
    <h1 style="color:#22c55e;">CLEAR!</h1>
    <p>按下 <b style="color:white">Enter</b> 進入下一關</p>
    <button class="btn-s" onclick="toNext()">下一關</button>
</div>

<div id="menu-screen" class="overlay" style="justify-content: flex-start; padding-top: 40px; overflow-y: auto;">
    <h2>關卡解鎖進度</h2>
    <div id="lv-list" class="lv-grid"></div>
    <button class="btn-s" style="margin-top:20px" onclick="closeMenu()">關閉</button>
</div>

<div class="controls">
    <div style="text-align: center; margin-bottom: 10px;"><button class="btn-s" style="background:#334155; width: 160px;" onclick="stepBack()">撤銷 (Z)</button></div>
    <div class="dpad">
        <div></div><div class="btn-ctrl" onclick="doMove(-1,0)">▲</div><div></div>
        <div class="btn-ctrl" onclick="doMove(0,-1)">◀</div><div class="btn-ctrl" onclick="doMove(1,0)">▼</div><div class="btn-ctrl" onclick="doMove(0,1)">▶</div>
    </div>
</div>

<script>
    // --- 強制清理指令 ---
    localStorage.clear(); // 抹除所有舊版緩存，確保重新開始

    // --- 嚴選 Microban 關卡數據 (確保第一關是開闊的) ---
    const FINAL_MAP_DATA = [
        ["  ###  ","###.#  ","# @$#  ","#  $#  ","#  .###","###### "], // 真正的 L1
        ["####   ","#  ### ","# @$ # ","#  $ # ","#  . # ","#  ### ","####   "], // L2
        [" ##### "," #@  # "," # $ # "," #  .# "," ##### "],            // L3
        ["#######","#     #","# @$  #","#  $. #","#######"],            // L4
        [" ##### "," #.  # "," # $  # "," #$@. # "," ##### "],           // L5
        ["#######","#@ $ .#","# $ $ #","# . . #","#######"]             // L6
    ];

    const MAP_POOL = Array.from({length: 50}, (_, i) => FINAL_MAP_DATA[i % FINAL_MAP_DATA.length]);

    let activeLv = 0;
    let maxUnlocked = 0;
    let currentGrid = [], moveHistory = [], isLevelClear = false;

    function startLevel(idx) {
        activeLv = idx;
        currentGrid = MAP_POOL[idx].map(row => row.split(''));
        moveHistory = [];
        isLevelClear = false;
        document.getElementById('win-screen').style.display = 'none';
        document.getElementById('menu-screen').style.display = 'none';
        
        const w = Math.max(...currentGrid.map(r => r.length));
        const s = Math.min(48, Math.floor((window.innerWidth - 40) / w));
        document.documentElement.style.setProperty('--cell', s + 'px');
        draw();
    }

    function draw() {
        const board = document.getElementById('main-grid');
        board.innerHTML = '';
        document.getElementById('lv-num').innerText = activeLv + 1;
        
        currentGrid.forEach(row => {
            const rDiv = document.createElement('div');
            rDiv.className = 'row';
            row.forEach(cell => {
                const cDiv = document.createElement('div');
                cDiv.className = 'cell';
                if(cell === '#') cDiv.classList.add('wall');
                if(['.', '*', '+'].includes(cell)) cDiv.classList.add('target');
                if(cell === '$' || cell === '*') {
                    const b = document.createElement('div');
                    b.className = 'box' + (cell === '*' ? ' box-ok' : '');
                    b.innerText = '📦'; cDiv.appendChild(b);
                }
                if(cell === '@' || cell === '+') {
                    const p = document.createElement('div');
                    p.className = 'player'; p.innerText = '👤'; cDiv.appendChild(p);
                }
                rDiv.appendChild(cDiv);
            });
            board.appendChild(rDiv);
        });
        checkFinal();
    }

    function doMove(dr, dc) {
        if(isLevelClear) return;
        let pr, pc;
        for(let r=0; r<currentGrid.length; r++) {
            for(let c=0; c<currentGrid[r].length; c++) {
                if(currentGrid[r][c] === '@' || currentGrid[r][c] === '+') { pr=r; pc=c; break; }
            }
        }
        const nr = pr+dr, nc = pc+dc;
        const target = currentGrid[nr][nc];
        const state = JSON.stringify(currentGrid);

        if(target === ' ' || target === '.') {
            currentGrid[pr][pc] = (currentGrid[pr][pc] === '+') ? '.' : ' ';
            currentGrid[nr][nc] = (target === '.') ? '+' : '@';
            moveHistory.push(state);
        } else if(target === '$' || target === '*') {
            const nnr = nr+dr, nnc = nc+dc;
            if(currentGrid[nnr] && (currentGrid[nnr][nnc] === ' ' || currentGrid[nnr][nnc] === '.')) {
                currentGrid[nnr][nnc] = (currentGrid[nnr][nnc] === '.') ? '*' : '$';
                currentGrid[nr][nc] = (target === '*') ? '+' : '@';
                currentGrid[pr][pc] = (currentGrid[pr][pc] === '+') ? '.' : ' ';
                moveHistory.push(state);
            }
        }
        draw();
    }

    function checkFinal() {
        const stillIncomplete = currentGrid.some(r => r.includes('$') || r.includes('.'));
        const onGoal = currentGrid.some(r => r.includes('+'));
        if (!stillIncomplete && !onGoal && !isLevelClear) {
            isLevelClear = true;
            if(activeLv === maxUnlocked) maxUnlocked++;
            setTimeout(() => { document.getElementById('win-screen').style.display = 'flex'; }, 200);
        }
    }

    window.addEventListener('keydown', e => {
        if(isLevelClear && e.key === 'Enter') toNext();
        const k = e.key.toLowerCase();
        if(k==='w'||e.key==='ArrowUp') doMove(-1,0);
        if(k==='s'||e.key==='ArrowDown') doMove(1,0);
        if(k==='a'||e.key==='ArrowLeft') doMove(0,-1);
        if(k==='d'||e.key==='ArrowRight') doMove(0,1);
        if(k==='z') stepBack();
        if(k==='r') resetLevel();
    });

    function openMenu() {
        const list = document.getElementById('lv-list');
        list.innerHTML = '';
        for(let i=0; i<50; i++) {
            const item = document.createElement('div');
            item.className = `lv-item ${i <= maxUnlocked ? 'unlocked' : ''}`;
            item.innerText = i + 1;
            if(i <= maxUnlocked) item.onclick = () => startLevel(i);
            list.appendChild(item);
        }
        document.getElementById('menu-screen').style.display = 'flex';
    }
    function closeMenu() { document.getElementById('menu-screen').style.display = 'none'; }
    function stepBack() { if(moveHistory.length>0) { currentGrid = JSON.parse(moveHistory.pop()); draw(); } }
    function resetLevel() { startLevel(activeLv); }
    function toNext() { if(activeLv < 49) startLevel(activeLv + 1); }

    startLevel(0);
</script>
</body>
</html>
