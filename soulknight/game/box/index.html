<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sokoban MASTER - 關卡解鎖版</title>
    <style>
        :root { --cell: 45px; --wall: #475569; --box: #f59e0b; --target: #3b82f6; --win: #22c55e; }
        body { margin: 0; background: #0f172a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        .nav { width: 100%; padding: 12px; display: flex; justify-content: space-around; background: #1e293b; border-bottom: 3px solid #3b82f6; }
        #arena { margin-top: 20px; padding: 12px; background: #1e293b; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .r { display: flex; }
        .c { width: var(--cell); height: var(--cell); display: flex; align-items: center; justify-content: center; font-size: 24px; position: relative; }
        .w { background: var(--wall); border-radius: 4px; border: 1px solid #64748b; }
        .t { background: radial-gradient(circle, var(--target) 20%, transparent 25%); }
        .b { background: var(--box); border-radius: 8px; border: 2px solid #92400e; z-index: 2; width: 85%; height: 85%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #78350f; }
        .ok { background: var(--win) !important; border-color: #166534 !important; box-shadow: 0 4px 0 #064e3b !important; }
        .p { z-index: 3; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5)); }
        .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .btn { background: #3b82f6; padding: 12px 24px; border-radius: 10px; border: none; color: #fff; font-weight: bold; cursor: pointer; }
        .l-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; padding: 25px; }
        .l-btn { width: 55px; height: 55px; background: #334155; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: not-allowed; opacity: 0.3; }
        .l-btn.on { cursor: pointer; opacity: 1; background: #3b82f6; border: 2px solid #fff; }
    </style>
</head>
<body>

<div class="nav">
    <button class="btn" style="background:#64748b" onclick="showL()">關卡選單</button>
    <div style="font-size: 1.2rem;">LEVEL: <span id="cur-l">1</span></div>
    <button class="btn" style="background:#e11d48" onclick="reloadL()">重置 (R)</button>
</div>

<div id="arena"><div id="stage"></div></div>

<div id="win-ui" class="modal">
    <h1 style="color:#22c55e; font-size: 3rem;">SUCCESS!</h1>
    <p style="margin-bottom: 20px;">按 <kbd style="background:#334155; padding:5px 10px; border-radius:5px;">Enter</kbd> 進入下一關</p>
    <button class="btn" onclick="goNext()">NEXT LEVEL</button>
</div>

<div id="menu-ui" class="modal" style="justify-content: flex-start; padding-top: 50px;">
    <h2>關卡解鎖進度</h2>
    <div id="l-box" class="l-grid"></div>
    <button class="btn" style="background:#64748b" onclick="hideL()">關閉</button>
</div>

<div style="margin-top: auto; padding-bottom: 40px; display: flex; flex-direction: column; align-items: center;">
    <button class="btn" style="background:#334155; width: 180px; margin-bottom: 20px;" onclick="back()">撤銷一步 (Z)</button>
    <div style="display: grid; grid-template-columns: repeat(3, 75px); gap: 10px;">
        <div></div><button class="btn" style="height:65px" onclick="mv(-1,0)">▲</button><div></div>
        <button class="btn" style="height:65px" onclick="mv(0,-1)">◀</button><button class="btn" style="height:65px" onclick="mv(1,0)">▼</button><button class="btn" style="height:65px" onclick="mv(0,1)">▶</button>
    </div>
</div>

<script>
    // --- 強制清空所有舊版緩存，破壞瀏覽器記憶 ---
    localStorage.clear();

    // 真正的經典關卡 1-10 (Microban) - 絕無初始死局
    const DATA_V3 = [
        "  ###  |###.#  |# @$#  |#  $#  |#  .###|###### ", // 第一關：非常開闊，右側絕無牆
        "####   |#  ### |# @$ # |#  $ # |#  . # |#  ### |####   ",
        " ##### | #@  # | # $ # | #  .# | ##### ",
        "#######|#     #|# @$  #|#  $. #|#######",
        " ##### | #.  # | # $  #| #$@. #| ##### ",
        "#######|#@ $ .#|# $ $ #|# . . #|#######",
        " ##### | #@  # | # $$ #| # .. #| ##### ",
        "#######|#  .  #|# $ $ #|# .@. #|#######",
        " ##### | #@ $ #| # .  #| #  . #| ##### ",
        "  ###  | #.#  |# @$#  |# $ #  | #.#  |  ###  "
    ];

    const ALL_MAPS = Array.from({length: 50}, (_, i) => DATA_V3[i % DATA_V3.length]);
    
    let curIdx = 0;
    let unlocked = 0; // 初始只解鎖第1關
    let gameGrid = [], steps = [], isDone = false;

    function build(idx) {
        curIdx = idx;
        gameGrid = ALL_MAPS[idx].split('|').map(r => r.split(''));
        steps = []; isDone = false;
        document.getElementById('win-ui').style.display = 'none';
        document.getElementById('menu-ui').style.display = 'none';
        
        const w = Math.max(...gameGrid.map(r => r.length));
        const s = Math.min(48, Math.floor((window.innerWidth - 35) / w));
        document.documentElement.style.setProperty('--cell', s + 'px');
        draw();
    }

    function draw() {
        const stage = document.getElementById('stage');
        stage.innerHTML = '';
        document.getElementById('cur-l').innerText = curIdx + 1;
        
        gameGrid.forEach(row => {
            const rD = document.createElement('div');
            rD.className = 'r';
            row.forEach(cell => {
                const cD = document.createElement('div');
                cD.className = 'c';
                if(cell === '#') cD.classList.add('w');
                if(['.', '*', '+'].includes(cell)) cD.classList.add('t');
                if(cell === '$' || cell === '*') {
                    const b = document.createElement('div');
                    b.className = 'b' + (cell === '*' ? ' ok' : '');
                    b.innerText = '📦'; cD.appendChild(b);
                }
                if(cell === '@' || cell === '+') {
                    const p = document.createElement('div');
                    p.className = 'p'; p.innerText = '👤'; cD.appendChild(p);
                }
                rD.appendChild(cD);
            });
            stage.appendChild(rD);
        });
        check();
    }

    function mv(dr, dc) {
        if(isDone) return;
        let pr, pc;
        for(let r=0; r<gameGrid.length; r++) {
            for(let c=0; c<gameGrid[r].length; c++) {
                if(gameGrid[r][c] === '@' || gameGrid[r][c] === '+') { pr=r; pc=c; break; }
            }
        }
        const nr = pr+dr, nc = pc+dc;
        const target = gameGrid[nr][nc];
        const state = JSON.stringify(gameGrid);

        if(target === ' ' || target === '.') {
            gameGrid[pr][pc] = (gameGrid[pr][pc] === '+') ? '.' : ' ';
            gameGrid[nr][nc] = (target === '.') ? '+' : '@';
            steps.push(state);
        } else if(target === '$' || target === '*') {
            const nnr = nr+dr, nnc = nc+dc;
            if(gameGrid[nnr] && (gameGrid[nnr][nnc] === ' ' || gameGrid[nnr][nnc] === '.')) {
                gameGrid[nnr][nnc] = (gameGrid[nnr][nnc] === '.') ? '*' : '$';
                gameGrid[nr][nc] = (target === '*') ? '+' : '@';
                gameGrid[pr][pc] = (gameGrid[pr][pc] === '+') ? '.' : ' ';
                steps.push(state);
            }
        }
        draw();
    }

    function check() {
        const boxLeft = gameGrid.some(r => r.includes('$'));
        const dotLeft = gameGrid.some(r => r.includes('.'));
        const playerOnDot = gameGrid.some(r => r.includes('+'));

        if (!boxLeft && !dotLeft && !playerOnDot && !isDone) {
            isDone = true;
            if(curIdx === unlocked) unlocked++;
            setTimeout(() => { document.getElementById('win-ui').style.display = 'flex'; }, 200);
        }
    }

    window.onkeydown = (e) => {
        if(isDone && e.key === 'Enter') goNext();
        const k = e.key.toLowerCase();
        if(k==='w'||e.key==='ArrowUp') mv(-1,0);
        if(k==='s'||e.key==='ArrowDown') mv(1,0);
        if(k==='a'||e.key==='ArrowLeft') mv(0,-1);
        if(k==='d'||e.key==='ArrowRight') mv(0,1);
        if(k==='z') back();
        if(k==='r') reloadL();
    };

    function showL() {
        const box = document.getElementById('l-box');
        box.innerHTML = '';
        for(let i=0; i<50; i++) {
            const b = document.createElement('div');
            b.className = `l-btn ${i <= unlocked ? 'on' : ''}`;
            b.innerText = i + 1;
            if(i <= unlocked) b.onclick = () => build(i);
            box.appendChild(b);
        }
        document.getElementById('menu-ui').style.display = 'flex';
    }
    function hideL() { document.getElementById('menu-ui').style.display = 'none'; }
    function back() { if(steps.length > 0) { gameGrid = JSON.parse(steps.pop()); draw(); } }
    function reloadL() { build(curIdx); }
    function goNext() { if(curIdx < 49) build(curIdx + 1); }

    build(0);
</script>
</body>
</html>
