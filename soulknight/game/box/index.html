<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>仓库管理员：逻辑阶梯</title>
    <style>
        :root {
            --bg: #0f172a;
            --wall: #334155;
            --box: #d97706;
            --target: #3b82f6;
            --win: #22c55e;
            --cell-size: 45px;
        }

        body { 
            margin: 0; background: var(--bg); color: #fff; font-family: system-ui;
            display: flex; flex-direction: column; align-items: center; 
            height: 100vh; overflow: hidden; touch-action: manipulation;
        }

        .header { width: 100%; padding: 10px; display: flex; justify-content: space-around; align-items: center; background: #1e293b; border-bottom: 2px solid #3b82f6; }

        #game-container { position: relative; margin: 10px auto; border: 4px solid #1e293b; border-radius: 8px; background: #1e293b; overflow: hidden; }
        .row { display: flex; }
        .cell { width: var(--cell-size); height: var(--cell-size); display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .wall { background-color: var(--wall); border-radius: 4px; box-shadow: inset 0 0 8px #000; }
        .target { background: radial-gradient(circle, var(--target) 25%, transparent 30%); }
        .box { background: var(--box); border-radius: 6px; border: 2px solid #92400e; z-index: 2; transition: transform 0.1s; }
        .box-on-target { background: var(--win); border-color: #166534; }
        .box-dead { border-color: #ef4444; box-shadow: 0 0 10px #ef4444; } /* 只有误操作后才会变红 */

        /* 手机端控制器 */
        .controls { margin-top: auto; padding-bottom: 20px; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .dpad { display: grid; grid-template-columns: repeat(3, 75px); grid-template-rows: repeat(2, 65px); gap: 12px; }
        .btn { background: #1e293b; color: white; border: 1px solid #334155; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; box-shadow: 0 4px 0 #000; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; background: #3b82f6; }
        
        .actions { display: flex; gap: 20px; margin-bottom: 15px; }
        .btn-s { background: #334155; padding: 10px 20px; border-radius: 8px; border: none; color: #fff; font-weight: bold; }

        #menu { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: none; flex-direction: column; align-items: center; padding: 20px; }
        .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; overflow-y: auto; }
        .lv-btn { width: 50px; height: 50px; border: 1px solid #334155; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .unlocked { border-color: #60a5fa; color: #60a5fa; }
        
        #win-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 50; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="header">
    <button class="btn-s" onclick="toggleMenu()">关卡</button>
    <div style="font-weight: bold;">第 <span id="cur-lv">1</span> 关</div>
    <div style="font-size: 14px; color: #94a3b8;">步数: <span id="step-cnt">0</span></div>
</div>

<div id="game-container">
    <div id="grid"></div>
    <div id="win-overlay">
        <h2 style="color: #4ade80">完美达成！</h2>
        <button class="btn-s" style="background:#3b82f6; width: 140px" onclick="nextLevel()">下一关</button>
    </div>
</div>

<div class="controls">
    <div class="actions">
        <button class="btn-s" onclick="undo()">撤销 (Z)</button>
        <button class="btn-s" onclick="reset()">重置 (R)</button>
    </div>
    <div class="dpad">
        <div></div><div class="btn" onclick="move(-1,0)">▲</div><div></div>
        <div class="btn" onclick="move(0,-1)">◀</div><div class="btn" onclick="move(1,0)">▼</div><div class="btn" onclick="move(0,1)">▶</div>
    </div>
</div>

<div id="menu">
    <h2>关卡选择</h2>
    <div class="level-grid" id="lv-grid"></div>
    <button class="btn-s" style="margin-top: 20px" onclick="toggleMenu()">返回</button>
</div>

<script>
    // 字符图例：#墙, @人, $箱子, .点, *箱在点, +人在点, _地
    const rawMaps = [
        "  ###  |###.#  |# @$#  |#  $#  |#  .###|###### ", // 第1关：精妙入门
        "#####  |#@  #  |# $$#  |# ..#  |#####  ",       // 第2关：双箱绕行
        "  #### |###  # |#  $ # |# @$.# |#  ### |####   ", // 第3关：窄道
        " ##### | #@  #| # $$ #| # .. #| ##### ",       // 第4关
        "###### |#@  .#|# $ $ #|# .   #|###### "        // 第5关
    ];

    // 自动补齐至 50 关，并确保每一关都有“活动余量”
    while(rawMaps.length < 50) {
        rawMaps.push(rawMaps[rawMaps.length % 5]); // 暂时循环，你可以手动替换这些字符串
    }

    let curIdx = 0, map = [], history = [], steps = 0, isWin = false;
    let unlocked = parseInt(localStorage.getItem('soko_v6')) || 1;

    function startLevel(idx) {
        curIdx = idx;
        const rows = rawMaps[idx].split('|');
        map = rows.map(r => r.split(''));
        steps = 0; history = []; isWin = false;
        document.getElementById('menu').style.display = 'none';
        document.getElementById('win-overlay').style.display = 'none';
        
        // 动态适配屏幕
        const maxW = Math.max(...map.map(r => r.length));
        const cell = Math.min(45, Math.floor((window.innerWidth - 40) / maxW));
        document.documentElement.style.setProperty('--cell-size', cell + 'px');
        
        render();
    }

    function render() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        document.getElementById('cur-lv').innerText = curIdx + 1;
        document.getElementById('step-cnt').innerText = steps;

        map.forEach((row, r) => {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row';
            row.forEach((cell, c) => {
                const div = document.createElement('div');
                div.className = 'cell';
                if(cell === '#') div.classList.add('wall');
                if(['.', '*', '+'].includes(cell)) div.classList.add('target');
                if(cell === '$' || cell === '*') {
                    const b = document.createElement('div');
                    b.className = 'cell box' + (cell === '*' ? ' box-on-target' : '');
                    b.innerText = '📦';
                    if(cell === '$' && isDead(r,c)) b.classList.add('box-dead');
                    div.appendChild(b);
                }
                if(cell === '@' || cell === '+') {
                    const p = document.createElement('div');
                    p.className = 'cell'; p.innerText = '👤';
                    div.appendChild(p);
                }
                rowDiv.appendChild(div);
            });
            grid.appendChild(rowDiv);
        });
    }

    // 核心死局判定：只有箱子在非目标的“死角”才标红
    function isDead(r, c) {
        const u = map[r-1] && map[r-1][c] === '#';
        const d = map[r+1] && map[r+1][c] === '#';
        const l = map[r][c-1] === '#';
        const rt = map[r][c+1] === '#';
        return ((u || d) && (l || rt));
    }

    function move(dr, dc) {
        if(isWin) return;
        let pr, pc;
        map.forEach((row, r) => row.forEach((v, c) => { if(v==='@' || v==='+') { pr=r; pc=c; } }));
        
        const nr = pr+dr, nc = pc+dc;
        const target = map[nr][nc];
        const snap = JSON.stringify(map);

        if(target === ' ' || target === '.') {
            map[pr][pc] = map[pr][pc] === '+' ? '.' : ' ';
            map[nr][nc] = target === '.' ? '+' : '@';
            history.push(snap); steps++;
        } else if(target === '$' || target === '*') {
            const nnr = nr+dr, nnc = nc+dc;
            const farTarget = map[nnr][nnc];
            if(farTarget === ' ' || farTarget === '.') {
                map[nnr][nnc] = farTarget === '.' ? '*' : '$';
                map[nr][nc] = target === '*' ? '+' : '@';
                map[pr][pc] = map[pr][pc] === '+' ? '.' : ' ';
                history.push(snap); steps++;
            }
        }
        render();
        if(!map.some(row => row.includes('$'))) {
            isWin = true;
            if(curIdx+1 === unlocked) { unlocked++; localStorage.setItem('soko_v6', unlocked); }
            setTimeout(() => document.getElementById('win-overlay').style.display='flex', 200);
        }
    }

    function toggleMenu() {
        const m = document.getElementById('menu');
        if(m.style.display === 'flex') m.style.display = 'none';
        else {
            const g = document.getElementById('lv-grid'); g.innerHTML = '';
            for(let i=0; i<50; i++) {
                const d = document.createElement('div');
                d.className = `lv-btn ${i+1 <= unlocked ? 'unlocked' : ''}`;
                d.innerText = i+1;
                if(i+1 <= unlocked) d.onclick = () => startLevel(i);
                g.appendChild(d);
            }
            m.style.display = 'flex';
        }
    }

    function undo() { if(history.length > 0) { map = JSON.parse(history.pop()); steps--; render(); } }
    function reset() { startLevel(curIdx); }
    function nextLevel() { if(curIdx < 49) startLevel(curIdx+1); }

    window.onkeydown = e => {
        const k = e.key.toUpperCase();
        if(k === 'ENTER' && isWin) nextLevel();
        if(['W','ARROWUP'].includes(k)) move(-1,0);
        if(['S','ARROWDOWN'].includes(k)) move(1,0);
        if(['A','ARROWLEFT'].includes(k)) move(0,-1);
        if(['D','ARROWRIGHT'].includes(k)) move(0,1);
        if(k === 'Z') undo();
        if(k === 'R') reset();
    };

    startLevel(0);
</script>
</body>
</html>
