<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>仓库管理员：逻辑修复版</title>
    <style>
        :root { --bg: #0f172a; --wall: #475569; --box: #f59e0b; --target: #3b82f6; --win: #22c55e; --cell: 45px; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; touch-action: manipulation; }
        .header { width: 100%; padding: 12px; display: flex; justify-content: space-around; align-items: center; background: #1e293b; border-bottom: 2px solid #3b82f6; }
        #game-board { position: relative; margin: 15px auto; padding: 5px; background: #1e293b; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .row { display: flex; }
        .cell { width: var(--cell); height: var(--cell); display: flex; align-items: center; justify-content: center; font-size: 24px; position: relative; }
        .wall { background: var(--wall); border-radius: 4px; border: 1px solid #64748b; }
        .target { background: radial-gradient(circle, var(--target) 20%, transparent 25%); }
        /* 箱子样式：在点位上变绿 */
        .box { background: var(--box); border-radius: 6px; border: 2px solid #92400e; z-index: 2; width: 82%; height: 82%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #78350f; }
        .box-ok { background: var(--win) !important; border-color: #166534 !important; box-shadow: 0 4px 0 #064e3b !important; }
        .player { z-index: 3; }
        .controls { margin-top: auto; padding-bottom: 25px; width: 100%; display: flex; flex-direction: column; align-items: center; }
        .dpad { display: grid; grid-template-columns: repeat(3, 75px); grid-template-rows: repeat(2, 65px); gap: 12px; }
        .btn { background: #1e293b; color: white; border: 2px solid #334155; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 4px 0 #000; }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; background: #3b82f6; }
        #win-ui { display: none; position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 100; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; }
        .btn-s { background: #334155; padding: 10px 20px; border-radius: 8px; border: none; color: #fff; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <div>第 <span id="lv-txt">1</span> 关</div>
    <button class="btn-s" onclick="reset()">重置</button>
    <div>步数: <span id="step-txt">0</span></div>
</div>

<div id="game-board">
    <div id="grid"></div>
    <div id="win-ui">
        <h2 style="color:#4ade80">恭喜通关！</h2>
        <button class="btn-s" style="background:#3b82f6; padding: 12px 30px;" onclick="nextLevel()">下一关</button>
    </div>
</div>

<div class="controls">
    <div style="margin-bottom: 10px;"><button class="btn-s" onclick="undo()">⬅ 撤销一步</button></div>
    <div class="dpad">
        <div></div><div class="btn" onclick="move(-1,0)">▲</div><div></div>
        <div class="btn" onclick="move(0,-1)">◀</div><div class="btn" onclick="move(1,0)">▼</div><div class="btn" onclick="move(0,1)">▶</div>
    </div>
</div>

<script>
    // #墙, @人, $箱, .点, *箱在点, +人在点, _地
    const maps = [
        "  ####|###  #|# @$ #|#  $.#|#  ###|####", // L1
        " #####| #@  #| # $ #| #  .#| #####",           // L2
        "#######|#     #|# @$  #|#  $. #|#######",    // L3
        "  #####|###   #|# @$  #|#  $. #|#  ####|####", // L4
        "#######|#     #|# @$  #|#  * #|#  .  #|#######" // L5
    ];

    let allLevels = [];
    for(let i=0; i<50; i++) allLevels.push(maps[i % maps.length]);

    let curIdx = 0, map = [], history = [], steps = 0, win = false;

    function init(idx) {
        curIdx = idx;
        const rows = allLevels[idx].split('|');
        map = rows.map(r => r.split(''));
        steps = 0; history = []; win = false;
        document.getElementById('win-ui').style.display = 'none';
        
        // 自动适配格子大小
        const maxW = Math.max(...map.map(r => r.length));
        const cell = Math.min(48, Math.floor((window.innerWidth - 30) / maxW));
        document.documentElement.style.setProperty('--cell', cell + 'px');
        render();
    }

    function render() {
        const gridEl = document.getElementById('grid');
        gridEl.innerHTML = '';
        document.getElementById('lv-txt').innerText = curIdx + 1;
        document.getElementById('step-txt').innerText = steps;

        map.forEach((row, r) => {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row';
            row.forEach((type, c) => {
                const div = document.createElement('div');
                div.className = 'cell';
                if(type === '#') div.classList.add('wall');
                if(['.', '*', '+'].includes(type)) div.classList.add('target');
                
                // 渲染箱子
                if(type === '$' || type === '*') {
                    const b = document.createElement('div');
                    b.className = 'box' + (type === '*' ? ' box-ok' : '');
                    b.innerText = '📦';
                    div.appendChild(b);
                }
                // 渲染角色
                if(type === '@' || type === '+') {
                    const p = document.createElement('div');
                    p.className = 'player'; p.innerText = '👤';
                    div.appendChild(p);
                }
                rowDiv.appendChild(div);
            });
            gridEl.appendChild(rowDiv);
        });
        
        // 每次渲染后检查是否通关
        checkWin();
    }

    function move(dr, dc) {
        if(win) return;
        let pr, pc;
        map.forEach((row, r) => row.forEach((v, c) => { if(v==='@' || v==='+') { pr=r; pc=c; } }));
        const nr = pr+dr, nc = pc+dc;
        if(!map[nr] || !map[nr][nc]) return;
        
        const targetCell = map[nr][nc];
        const snap = JSON.stringify(map);

        // 1. 移动到空地或目标点
        if(targetCell === ' ' || targetCell === '.') {
            map[pr][pc] = map[pr][pc] === '+' ? '.' : ' ';
            map[nr][nc] = targetCell === '.' ? '+' : '@';
            history.push(snap); steps++;
        } 
        // 2. 推箱子逻辑
        else if(targetCell === '$' || targetCell === '*') {
            const nnr = nr+dr, nnc = nc+dc;
            if(map[nnr] && (map[nnr][nnc] === ' ' || map[nnr][nnc] === '.')) {
                // 先移动箱子
                map[nnr][nnc] = map[nnr][nnc] === '.' ? '*' : '$';
                // 再移动人
                map[nr][nc] = targetCell === '*' ? '+' : '@';
                map[pr][pc] = map[pr][pc] === '+' ? '.' : ' ';
                history.push(snap); steps++;
            }
        }
        render();
    }

    function checkWin() {
        // 胜利条件：地图上没有任何一个 '$' 类型的箱子（即所有箱子都变成了 '*'）
        const hasUnfinishedBox = map.some(row => row.includes('$'));
        
        // 同时确保地图上至少有一个箱子在目标点（防止空关卡）
        const hasFinishedBox = map.some(row => row.includes('*'));

        if (!hasUnfinishedBox && hasFinishedBox && !win) {
            win = true;
            setTimeout(() => {
                document.getElementById('win-ui').style.display = 'flex';
            }, 300);
        }
    }

    function undo() { if(history.length > 0) { map = JSON.parse(history.pop()); steps--; render(); } }
    function reset() { init(curIdx); }
    function nextLevel() { if(curIdx < 49) init(curIdx+1); }

    init(0);
</script>
</body>
</html>
