<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sokoban 宗师之路 | 50关完美可解版</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        :root {
            --cell: 48px;
        }
        body {
            margin: 0;
            background: #0a0f1e;
            color: #e2e8f0;
            font-family: system-ui, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-wrapper {
            width: 100%;
            max-width: 650px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827cc;
            backdrop-filter: blur(8px);
            padding: 8px 18px;
            border-radius: 60px;
            margin-bottom: 18px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .level-badge {
            background: #1e293b;
            padding: 5px 20px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .btn {
            background: #3b82f6;
            border: none;
            padding: 7px 18px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.08s linear;
        }
        .btn:active { transform: scale(0.96); background: #2563eb; }
        .btn-gray { background: #475569; }
        .btn-red { background: #dc2626; }
        .board-area {
            background: #0f172a;
            border-radius: 32px;
            padding: 16px;
            box-shadow: 0 20px 35px -10px black;
        }
        #board {
            display: inline-block;
            background: #1e293b;
            border-radius: 24px;
            padding: 8px;
        }
        .row { display: flex; }
        .cell {
            width: var(--cell);
            height: var(--cell);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            background: #1e293b;
        }
        .wall {
            background: #2d3a4e;
            border-radius: 10px;
            box-shadow: inset 0 0 0 1px #5b6e8c;
        }
        .target {
            background: radial-gradient(circle at 35% 40%, #3b82f6 24%, transparent 30%);
        }
        .box {
            width: 80%;
            height: 80%;
            background: #f59e0b;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 0 #b45309;
        }
        .box-done {
            background: #22c55e !important;
            box-shadow: 0 4px 0 #15803d !important;
        }
        .player {
            filter: drop-shadow(0 3px 2px rgba(0,0,0,0.5));
            font-size: 34px;
        }
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-top: 18px;
        }
        .arrow-grid {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            gap: 12px;
        }
        .arrow {
            background: #2d3a4e;
            border: none;
            font-size: 28px;
            padding: 10px 0;
            border-radius: 56px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .arrow:active { background: #3b82f6; transform: scale(0.93); }
        .hotkeys {
            font-size: 11px;
            background: #111827aa;
            padding: 5px 16px;
            border-radius: 30px;
            color: #9ca3af;
        }
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(5, 12, 28, 0.97);
            backdrop-filter: blur(10px);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-card {
            background: #1e293b;
            padding: 28px 20px;
            border-radius: 56px;
            text-align: center;
            border: 1px solid #3b82f6;
            width: 85%;
            max-width: 320px;
        }
        .level-selector {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin: 20px 0;
            max-height: 55vh;
            overflow-y: auto;
            padding: 5px;
        }
        .level-item {
            background: #334155;
            border-radius: 36px;
            padding: 10px 0;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            cursor: not-allowed;
            opacity: 0.45;
        }
        .level-item.unlocked {
            cursor: pointer;
            opacity: 1;
            background: #3b82f6;
            border: 1px solid white;
        }
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172ae6;
            color: #facc15;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: bold;
            z-index: 350;
            animation: fadeOut 2s forwards;
            backdrop-filter: blur(8px);
            white-space: nowrap;
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-15px); visibility: hidden; }
        }
        @media (max-width: 550px) {
            :root { --cell: 42px; }
            .arrow-grid { grid-template-columns: repeat(3, 58px); gap: 8px; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="top-bar">
        <button class="btn btn-gray" onclick="openLevelPanel()">📋 选关</button>
        <div class="level-badge">第 <span id="levelNum">1</span> / 50 关</div>
        <button class="btn btn-red" onclick="resetMap()">🔄 重置</button>
    </div>

    <div class="board-area">
        <div id="board"></div>
    </div>

    <div class="controls">
        <div style="display: flex; gap: 18px;">
            <button class="btn btn-gray" onclick="undoAction()">↩️ 撤回 (Z)</button>
            <button class="btn btn-gray" onclick="giveHint()">💡 提示</button>
        </div>
        <div class="arrow-grid">
            <div></div>
            <button class="arrow" onclick="movePlayer(-1,0)">▲</button>
            <div></div>
            <button class="arrow" onclick="movePlayer(0,-1)">◀</button>
            <button class="arrow" onclick="movePlayer(1,0)">▼</button>
            <button class="arrow" onclick="movePlayer(0,1)">▶</button>
        </div>
        <div class="hotkeys">🎮 方向键 / WASD &nbsp;|&nbsp; R 重置 &nbsp;|&nbsp; Z 撤回 &nbsp;|&nbsp; ↵ 过关</div>
    </div>
</div>

<div id="winModal" class="modal">
    <div class="modal-card">
        <h1 style="color:#22c55e;">✨ 通关成功 ✨</h1>
        <p style="margin: 12px 0;">太棒了！继续挑战下一关</p>
        <button class="btn" onclick="gotoNext()">▶ 下一关</button>
    </div>
</div>

<div id="menuModal" class="modal">
    <div class="modal-card" style="max-width: 400px; width: 90%;">
        <h2>📌 解锁进度</h2>
        <div id="levelListContainer" class="level-selector"></div>
        <button class="btn btn-gray" onclick="closeLevelPanel()" style="margin-top: 12px;">关闭</button>
    </div>
</div>

<script>
    // ============================================================
    // 重新设计的 50 个关卡 - 全部为经典可解布局，难度递增
    // 使用标准 Sokoban 格式: #=墙, @=玩家, $=箱子, .=目标点
    // ============================================================
    const LEVEL_SET = [
        // 1-5 单箱教学
        "#####\n#@$.#\n#####",
        "######\n#@ $.#\n######",
        "#####\n#.@$#\n#####",
        "######\n#. @$ #\n######",
        "#####\n#@$ #\n# . #\n#####",
        
        // 6-10 单箱绕行
        "######\n#@$ .#\n#  #\n######",
        "#####\n#@$.#\n#...#\n#####",
        "######\n#. @$#\n#  .#\n######",
        "#####\n#@$ #\n# $.#\n#####",
        "######\n#@$..#\n#...#\n######",
        
        // 11-20 双箱入门
        "#####\n#@$ #\n# .$#\n#####",
        "######\n#@$ .#\n# $.#\n######",
        "#####\n#.@$#\n# $ .#\n#####",
        "######\n#@$ #\n# .$#\n# . #\n######",
        "#####\n#@$.#\n# $#\n# .#\n#####",
        "######\n#. @$ #\n# $ . #\n######",
        "#####\n#@$ #\n# $. #\n# .#\n#####",
        "######\n#@$..#\n# $..#\n#...#\n######",
        "#####\n#.@$#\n# $ #\n# .#\n#####",
        "######\n#@$ .#\n# $.#\n#..#\n######",
        
        // 21-30 双箱进阶
        "#####\n#@$ #\n# $.#\n# . #\n#####",
        "######\n#@$ #\n# $ .#\n# . #\n######",
        "#####\n#.@$#\n# $#\n# .#\n#...#\n#####",
        "######\n#@$..#\n# $..#\n# .#\n######",
        "#####\n#@$ #\n# $$.#\n# .#\n#####",
        "######\n#@$ #\n# $$ .#\n# ...#\n######",
        "#####\n#@$.#\n# $#\n# .$#\n#####",
        "######\n#.@$ #\n# $ $.#\n# . .#\n######",
        "#####\n#@$ #\n# $.#\n# .$#\n#####",
        "######\n#@$..#\n# $ .#\n# $.#\n######",
        
        // 31-40 三箱规划
        "#####\n#.@$#\n# $ $#\n# . .#\n#####",
        "######\n#@$ #\n# $$ .#\n# . .#\n######",
        "#####\n#@$.#\n# $ $#\n# . .#\n#####",
        "######\n#@$..#\n# $$.#\n# ...#\n######",
        "#####\n#.@$#\n# $$.#\n# .. #\n#####",
        "######\n#@$ #\n# $$ .#\n# .. #\n# . #\n######",
        "#####\n#@$.#\n# $$ #\n# ...#\n#####",
        "######\n#.@$ #\n# $$ .#\n# . .#\n# ..#\n######",
        "#####\n#@$ #\n# $$.#\n# . .#\n#####",
        "######\n#@$..#\n# $$..#\n# . .#\n######",
        
        // 41-50 大师挑战
        "#####\n#@$ #\n# $$.#\n# . .#\n#..#\n#####",
        "######\n#.@$ #\n# $$ .#\n# .. #\n# . #\n######",
        "#####\n#@$.#\n# $$#\n# . .#\n#..#\n#####",
        "######\n#@$..#\n# $$ .#\n# . .#\n# ...#\n######",
        "#####\n#.@$#\n# $$ #\n# . .#\n#..#\n#####",
        "######\n#@$..#\n# $$..#\n# . .#\n# . #\n######",
        "#####\n#@$ #\n# $$.#\n# . .#\n#..#\n#####",
        "######\n#.@$ #\n# $$ .#\n# .. #\n# . .#\n######",
        "#####\n#@$.#\n# $$ #\n# . .#\n# ...#\n#####",
        "######\n#@$..#\n# $$..#\n# . .#\n# ...#\n######"
    ];
    
    // 补齐到50关
    while (LEVEL_SET.length < 50) LEVEL_SET.push(LEVEL_SET[LEVEL_SET.length % 20]);
    if (LEVEL_SET.length > 50) LEVEL_SET.length = 50;
    
    // 解析文本地图为二维数组
    function parseMap(str) {
        const lines = str.split('\n');
        let maxLen = 0;
        for (let l of lines) maxLen = Math.max(maxLen, l.length);
        const grid = [];
        for (let i = 0; i < lines.length; i++) {
            const row = [];
            for (let j = 0; j < maxLen; j++) {
                let ch = j < lines[i].length ? lines[i][j] : ' ';
                row.push(ch);
            }
            grid.push(row);
        }
        return grid;
    }
    
    // ---------- 游戏状态 ----------
    let curLevel = 0;
    let maxUnlock = 0;
    let board = [];
    let stepHistory = [];
    let winState = false;
    
    // 存储
    function saveProgress() {
        localStorage.setItem('sokoban_unlock_progress', maxUnlock);
        localStorage.setItem('sokoban_cur_level', curLevel);
    }
    
    function loadProgress() {
        let unlock = localStorage.getItem('sokoban_unlock_progress');
        if (unlock !== null) maxUnlock = parseInt(unlock);
        else maxUnlock = 0;
        let lvl = localStorage.getItem('sokoban_cur_level');
        if (lvl !== null) curLevel = parseInt(lvl);
        else curLevel = 0;
        if (curLevel > maxUnlock) curLevel = maxUnlock;
        if (curLevel < 0) curLevel = 0;
        if (maxUnlock < 0) maxUnlock = 0;
    }
    
    // 胜利检测
    function isGameWon() {
        for (let i = 0; i < board.length; i++) {
            for (let j = 0; j < board[i].length; j++) {
                if (board[i][j] === '$') return false;
            }
        }
        return true;
    }
    
    function updateWin() {
        if (isGameWon() && !winState) {
            winState = true;
            if (curLevel === maxUnlock && curLevel + 1 < 50) {
                maxUnlock = curLevel + 1;
                saveProgress();
            }
            document.getElementById('winModal').style.display = 'flex';
            showMessage('🎉 过关！按 Enter 继续', false);
        }
    }
    
    // 移动逻辑
    function tryMove(dx, dy) {
        if (winState) return false;
        
        let px = -1, py = -1;
        for (let i = 0; i < board.length; i++) {
            for (let j = 0; j < board[i].length; j++) {
                if (board[i][j] === '@' || board[i][j] === '+') {
                    px = i; py = j;
                    break;
                }
            }
        }
        if (px === -1) return false;
        
        const nx = px + dx;
        const ny = py + dy;
        if (nx < 0 || ny < 0 || nx >= board.length || ny >= board[0].length) return false;
        
        const target = board[nx][ny];
        const snapshot = JSON.parse(JSON.stringify(board));
        
        // 行走
        if (target === ' ' || target === '.') {
            const wasOnTarget = (board[px][py] === '+');
            board[px][py] = wasOnTarget ? '.' : ' ';
            board[nx][ny] = (target === '.') ? '+' : '@';
            stepHistory.push(snapshot);
            renderBoard();
            updateWin();
            return true;
        }
        // 推箱子
        else if (target === '$' || target === '*') {
            const nnx = nx + dx;
            const nny = ny + dy;
            if (nnx < 0 || nny < 0 || nnx >= board.length || nny >= board[0].length) return false;
            const beyond = board[nnx][nny];
            if (beyond === ' ' || beyond === '.') {
                const boxOnTarget = (target === '*');
                const beyondIsTarget = (beyond === '.');
                
                board[nnx][nny] = beyondIsTarget ? '*' : '$';
                board[nx][ny] = boxOnTarget ? '+' : '@';
                const playerWasTarget = (board[px][py] === '+');
                board[px][py] = playerWasTarget ? '.' : ' ';
                
                stepHistory.push(snapshot);
                renderBoard();
                updateWin();
                return true;
            }
        }
        return false;
    }
    
    function undoAction() {
        if (winState) return;
        if (stepHistory.length === 0) {
            showMessage('没有可撤回的步骤', true);
            return;
        }
        board = stepHistory.pop();
        winState = false;
        document.getElementById('winModal').style.display = 'none';
        renderBoard();
    }
    
    function resetMap() {
        board = parseMap(LEVEL_SET[curLevel]);
        stepHistory = [];
        winState = false;
        document.getElementById('winModal').style.display = 'none';
        renderBoard();
        showMessage('关卡已重置', false);
    }
    
    function loadLevel(idx) {
        if (idx > maxUnlock) {
            showMessage(`⚠️ 第${idx+1}关未解锁，请先通关前面的关卡`, true);
            return false;
        }
        curLevel = idx;
        board = parseMap(LEVEL_SET[curLevel]);
        stepHistory = [];
        winState = false;
        document.getElementById('winModal').style.display = 'none';
        renderBoard();
        saveProgress();
        showMessage(`进入第 ${curLevel+1} 关`, false);
        return true;
    }
    
    function gotoNext() {
        if (!winState) {
            showMessage('请先完成当前关卡', true);
            return;
        }
        if (curLevel + 1 < 50) loadLevel(curLevel + 1);
        else showMessage('🏆 恭喜你完成了全部50关！绝世高手！', false);
    }
    
    // 渲染
    function renderBoard() {
        const container = document.getElementById('board');
        container.innerHTML = '';
        document.getElementById('levelNum').innerText = curLevel + 1;
        
        for (let i = 0; i < board.length; i++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row';
            for (let j = 0; j < board[i].length; j++) {
                const ch = board[i][j];
                const cell = document.createElement('div');
                cell.className = 'cell';
                
                if (ch === '.' || ch === '+' || ch === '*') cell.classList.add('target');
                if (ch === '#') cell.classList.add('wall');
                
                if (ch === '$' || ch === '*') {
                    const box = document.createElement('div');
                    box.className = 'box';
                    if (ch === '*') box.classList.add('box-done');
                    box.innerText = '📦';
                    cell.appendChild(box);
                }
                if (ch === '@' || ch === '+') {
                    const player = document.createElement('div');
                    player.className = 'player';
                    player.innerText = '😀';
                    cell.appendChild(player);
                }
                rowDiv.appendChild(cell);
            }
            container.appendChild(rowDiv);
        }
    }
    
    // UI 辅助
    function openLevelPanel() {
        const container = document.getElementById('levelListContainer');
        container.innerHTML = '';
        for (let i = 0; i < 50; i++) {
            const btn = document.createElement('div');
            btn.className = 'level-item';
            btn.innerText = i + 1;
            if (i <= maxUnlock) {
                btn.classList.add('unlocked');
                btn.onclick = (idx => () => { loadLevel(idx); closeLevelPanel(); })(i);
            }
            container.appendChild(btn);
        }
        document.getElementById('menuModal').style.display = 'flex';
    }
    
    function closeLevelPanel() {
        document.getElementById('menuModal').style.display = 'none';
    }
    
    function giveHint() {
        const tips = [
            "💡 把箱子推到蓝色光点上", "💡 所有箱子归位即可过关",
            "💡 避免箱子贴墙死角", "💡 按 Z 撤回重新规划",
            "💡 难度逐渐上升，保持耐心"
        ];
        showMessage(tips[Math.floor(Math.random() * tips.length)], false);
    }
    
    function showMessage(msg, isErr = false) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = msg;
        if (isErr) toast.style.color = '#f97316';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }
    
    // 键盘控制
    window.addEventListener('keydown', (e) => {
        const key = e.key;
        if (winState && key === 'Enter') {
            e.preventDefault();
            gotoNext();
            return;
        }
        if (key === 'ArrowUp' || key === 'w' || key === 'W') { e.preventDefault(); tryMove(-1, 0); }
        else if (key === 'ArrowDown' || key === 's' || key === 'S') { e.preventDefault(); tryMove(1, 0); }
        else if (key === 'ArrowLeft' || key === 'a' || key === 'A') { e.preventDefault(); tryMove(0, -1); }
        else if (key === 'ArrowRight' || key === 'd' || key === 'D') { e.preventDefault(); tryMove(0, 1); }
        else if (key === 'z' || key === 'Z') { e.preventDefault(); undoAction(); }
        else if (key === 'r' || key === 'R') { e.preventDefault(); resetMap(); }
    });
    
    // 挂载全局函数
    window.movePlayer = tryMove;
    window.undoAction = undoAction;
    window.resetMap = resetMap;
    window.gotoNext = gotoNext;
    window.openLevelPanel = openLevelPanel;
    window.closeLevelPanel = closeLevelPanel;
    window.giveHint = giveHint;
    
    // 启动游戏
    loadProgress();
    board = parseMap(LEVEL_SET[curLevel]);
    stepHistory = [];
    winState = false;
    renderBoard();
</script>
</body>
</html>
