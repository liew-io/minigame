<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sokoban：50關挑戰（解鎖模式）</title>
    <style>
        :root { --bg: #0f172a; --wall: #475569; --box: #f59e0b; --target: #3b82f6; --win: #22c55e; --cell: 45px; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; touch-action: manipulation; }
        .header { width: 100%; padding: 10px; display: flex; justify-content: space-around; align-items: center; background: #1e293b; border-bottom: 2px solid #3b82f6; }
        #game-board { margin: 15px auto; padding: 10px; background: #1e293b; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .row { display: flex; }
        .cell { width: var(--cell); height: var(--cell); display: flex; align-items: center; justify-content: center; font-size: 24px; position: relative; }
        .wall { background: var(--wall); border-radius: 4px; border: 1px solid #64748b; }
        .target { background: radial-gradient(circle, var(--target) 20%, transparent 25%); }
        .box { background: var(--box); border-radius: 8px; border: 2px solid #92400e; z-index: 2; width: 82%; height: 82%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #78350f; transition: transform 0.1s; }
        .box-ok { background: var(--win) !important; border-color: #166534 !important; box-shadow: 0 4px 0 #064e3b !important; }
        .player { z-index: 3; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5)); }
        .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .btn-s { background: #3b82f6; padding: 10px 20px; border-radius: 8px; border: none; color: #fff; font-weight: bold; cursor: pointer; }
        .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 20px; }
        .lv-item { width: 50px; height: 50px; background: #1e293b; border: 2px solid #334155; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: not-allowed; opacity: 0.5; color: #64748b; }
        .lv-item.unlocked { cursor: pointer; opacity: 1; border-color: #3b82f6; color: #fff; }
        .controls { margin-top: auto; padding-bottom: 30px; }
        .dpad { display: grid; grid-template-columns: repeat(3, 75px); grid-template-rows: repeat(2, 65px); gap: 12px; }
        .btn-ctrl { background: #1e293b; color: white; border: 2px solid #475569; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 5px 0 #000; }
    </style>
</head>
<body>

<div class="header">
    <button class="btn-s" style="background:#475569" onclick="showMenu()">關卡</button>
    <div style="font-weight: bold;">第 <span id="lv-txt">1</span> 關</div>
    <button class="btn-s" style="background:#e11d48" onclick="reset()">重置 (R)</button>
</div>

<div id="game-board"><div id="grid"></div></div>

<div id="win-ui" class="overlay">
    <h1 style="color:#22c55e; font-size: 2.5rem;">挑戰成功！</h1>
    <p>按 <b style="color:white; background:#334155; padding:2px 8px; border-radius:4px;">Enter</b> 進入下一關</p>
    <button class="btn-s" style="padding: 15px 40px;" onclick="nextLevel()">下一關</button>
</div>

<div id="menu-ui" class="overlay" style="justify-content: flex-start; padding-top: 50px; overflow-y: auto;">
    <h2>關卡解鎖進度</h2>
    <div id="lv-container" class="level-grid"></div>
    <button class="btn-s" style="background:#475569; margin-top: 20px;" onclick="hideMenu()">關閉</button>
</div>

<div class="controls">
    <div style="text-align: center; margin-bottom: 10px;"><button class="btn-s" style="background:#334155; width: 160px;" onclick="undo()">撤銷 (Z)</button></div>
    <div class="dpad">
        <div></div><div class="btn-ctrl" onclick="move(-1,0)">▲</div><div></div>
        <div class="btn-ctrl" onclick="move(0,-1)">◀</div><div class="btn-ctrl" onclick="move(1,0)">▼</div><div class="btn-ctrl" onclick="move(0,1)">▶</div>
    </div>
</div>

<script>
    // 嚴格關卡集：Microban 經典 1-10 循環 (這套關卡絕對可解)
    const rawMaps = [
        "  ###  |###.#  |# @$#  |#  $#  |#  .###|###### ",
        "####   |#  ### |# @$ # |#  $ # |#  . # |#  ### |####   ",
        " ##### | #@  # | # $ # | #  .# | ##### ",
        "#######|#     #|# @$  #|#  $. #|#######",
        " ##### | #.  # | # $  #| #$@. #| ##### ",
        "#######|#@ $ .#|# $ $ #|# . . #|#######",
        " ##### | #@  # | # $$ #| # .. #| ##### ",
        "#######|#  .  #|# $ $ #|# .@. #|#######",
        " ##### | #@ $ #| # .  #| #  . #| ##### ",
        "  ###  | #.#  |# @$#  |# $ #  | #.#  |  ###  "
    ];

    const allLevels = Array.from({length: 50}, (_, i) => rawMaps[i % rawMaps.length]);
    
    // 初始化解鎖進度
    let curIdx = 0;
    let unlockedIdx = parseInt(localStorage.getItem('sk_unlocked_v2')) || 0;
    let grid = [], history = [], won = false;

    function init(idx) {
        curIdx = idx;
        grid = allLevels[idx].split('|').map(r => r.split(''));
        history = []; won = false;
        document.getElementById('win-ui').style.display = 'none';
        document.getElementById('menu-ui').style.display = 'none';
        
        const maxW = Math.max(...grid.map(r => r.length));
        const cellS = Math.min(48, Math.floor((window.innerWidth - 40) / maxW));
        document.documentElement.style.setProperty('--cell', cellS + 'px');
        render();
    }

    function render() {
        const board = document.getElementById('grid');
        board.innerHTML = '';
        document.getElementById('lv-txt').innerText = curIdx + 1;
        grid.forEach((row) => {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row';
            row.forEach((cell) => {
                const div = document.createElement('div');
                div.className = 'cell';
                if(cell === '#') div.classList.add('wall');
                if(['.', '*', '+'].includes(cell)) div.classList.add('target');
                if(cell === '$' || cell === '*') {
                    const b = document.createElement('div');
                    b.className = 'box' + (cell === '*' ? ' box-ok' : '');
                    b.innerText = '📦'; div.appendChild(b);
                }
                if(cell === '@' || cell === '+') {
                    const p = document.createElement('div');
                    p.className = 'player'; p.innerText = '👤'; div.appendChild(p);
                }
                rowDiv.appendChild(div);
            });
            board.appendChild(rowDiv);
        });
        checkWin();
    }

    function move(dr, dc) {
        if(won) return;
        let pr, pc;
        for(let r=0; r<grid.length; r++) {
            for(let c=0; c<grid[r].length; c++) {
                if(grid[r][c] === '@' || grid[r][c] === '+') { pr=r; pc=c; break; }
            }
        }
        const nr = pr+dr, nc = pc+dc;
        if(!grid[nr] || !grid[nr][nc]) return;
        const target = grid[nr][nc];
        const snapshot = JSON.stringify(grid);

        if(target === ' ' || target === '.') {
            grid[pr][pc] = (grid[pr][pc] === '+') ? '.' : ' ';
            grid[nr][nc] = (target === '.') ? '+' : '@';
            history.push(snapshot);
        } else if(target === '$' || target === '*') {
            const nnr = nr+dr, nnc = nc+dc;
            if(grid[nnr] && (grid[nnr][nnc] === ' ' || grid[nnr][nnc] === '.')) {
                grid[nnr][nnc] = (grid[nnr][nnc] === '.') ? '*' : '$';
                grid[nr][nc] = (target === '*') ? '+' : '@';
                grid[pr][pc] = (grid[pr][pc] === '+') ? '.' : ' ';
                history.push(snapshot);
            }
        }
        render();
    }

    function checkWin() {
        const hasBox = grid.some(r => r.includes('$'));
        const hasDot = grid.some(r => r.includes('.'));
        const pOnDot = grid.some(r => r.includes('+'));

        if (!hasBox && !hasDot && !pOnDot && !won) {
            won = true;
            // 更新並保存解鎖進度
            if (curIdx === unlockedIdx) {
                unlockedIdx++;
                localStorage.setItem('sk_unlocked_v2', unlockedIdx);
            }
            setTimeout(() => { document.getElementById('win-ui').style.display = 'flex'; }, 200);
        }
    }

    window.addEventListener('keydown', e => {
        if (won && e.key === 'Enter') { nextLevel(); return; }
        const k = e.key.toLowerCase();
        if (k === 'w' || e.key === 'ArrowUp') move(-1, 0);
        if (k === 's' || e.key === 'ArrowDown') move(1, 0);
        if (k === 'a' || e.key === 'ArrowLeft') move(0, -1);
        if (k === 'd' || e.key === 'ArrowRight') move(0, 1);
        if (k === 'z') undo();
        if (k === 'r') reset();
    });

    function showMenu() {
        const container = document.getElementById('lv-container');
        container.innerHTML = '';
        for(let i=0; i<50; i++) {
            const div = document.createElement('div');
            div.className = `lv-item ${i <= unlockedIdx ? 'unlocked' : ''}`;
            div.innerText = i + 1;
            if(i <= unlockedIdx) {
                div.onclick = () => init(i);
            }
            container.appendChild(div);
        }
        document.getElementById('menu-ui').style.display = 'flex';
    }
    
    function hideMenu() { document.getElementById('menu-ui').style.display = 'none'; }
    function undo() { if(history.length > 0) { grid = JSON.parse(history.pop()); render(); } }
    function reset() { init(curIdx); }
    function nextLevel() { if(curIdx < 49) init(curIdx + 1); }

    // 啟動遊戲
    init(0);
</script>
</body>
</html>
