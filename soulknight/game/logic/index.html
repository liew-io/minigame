<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逻辑推理 · 地狱级座位安排</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e0c;
    --surface: #1a1916;
    --surface2: #222018;
    --border: #2e2c28;
    --border2: #3d3a34;
    --text: #e8e4d8;
    --text2: #9a9488;
    --text3: #5c5a54;
    --accent: #c8a96e;
    --accent2: #9b7c45;
    --green: #6aab7a;
    --red: #c46060;
    --blue: #6b92c8;
    --window-color: #6aab7a;
    --aisle-color: #c8a96e;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Serif SC', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .topbar-meta {
    display: flex;
    gap: 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text2);
  }
  .meta-val { color: var(--text); font-weight: 600; }

  .puz-selector {
    display: flex;
    gap: 0;
    padding: 0 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    overflow-x: auto;
  }
  .puz-tab {
    padding: 14px 20px;
    font-family: 'Noto Serif SC', serif;
    font-size: 13px;
    color: var(--text2);
    cursor: pointer;
    border: none;
    background: none;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .puz-tab:hover { color: var(--text); }
  .puz-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .main {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 0;
    min-height: calc(100vh - 105px);
  }

  .clues-panel {
    border-right: 1px solid var(--border);
    background: var(--surface);
    padding: 28px 24px;
    overflow-y: auto;
    max-height: calc(100vh - 105px);
    position: sticky;
    top: 105px;
  }
  .panel-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .clue-item {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    transition: all 0.2s;
    cursor: default;
  }
  .clue-item:last-child { border-bottom: none; }
  .clue-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent2);
    min-width: 20px;
    padding-top: 2px;
  }
  .clue-text {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text2);
  }
  .clue-item:hover .clue-text { color: var(--text); }

  .right-panel {
    padding: 28px 32px;
    overflow-y: auto;
    max-height: calc(100vh - 105px);
  }

  .scene-header { margin-bottom: 24px; }
  .scene-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }
  .scene-desc { font-size: 13px; color: var(--text2); }

  .grid-wrapper {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .grid-legend {
    display: flex;
    gap: 20px;
    margin-bottom: 16px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
  }
  .legend-pip { width: 16px; height: 3px; border-radius: 2px; }

  .seat-grid { display: grid; gap: 8px; }
  .seat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    min-height: 68px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .seat:hover { border-color: var(--border2); background: #201e1b; }
  .seat.window-seat { border-top: 2px solid var(--window-color); }
  .seat.aisle-seat { border-left: 2px solid var(--aisle-color); }
  .seat.targeted {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
    background: #201e14;
  }
  .seat.correct { border-color: var(--green); background: #111a13; }
  .seat.wrong { border-color: var(--red); background: #1a1111; }
  .seat-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .seat-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text3);
  }
  .seat-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .seat-tag {
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--border);
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
  }
  .seat-tag.win { background: #1a2e1e; color: var(--window-color); }
  .seat-tag.ais { background: #2a2412; color: var(--aisle-color); }
  .seat-tag.front { background: #1a1e2e; color: var(--blue); }
  .seat-person {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-top: 6px;
    min-height: 22px;
  }
  .seat-person.empty { color: var(--border2); font-weight: 400; font-size: 12px; }

  .tray-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .people-tray {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }
  .person-chip {
    padding: 7px 16px;
    border: 1px solid var(--border2);
    border-radius: 99px;
    font-size: 14px;
    cursor: pointer;
    background: var(--surface);
    color: var(--text);
    transition: all 0.15s;
    font-family: 'Noto Serif SC', serif;
  }
  .person-chip:hover { border-color: var(--accent2); color: var(--accent); }
  .person-chip.active {
    background: var(--accent2);
    border-color: var(--accent);
    color: #0f0e0c;
    font-weight: 700;
    box-shadow: 0 0 12px rgba(200,169,110,0.3);
  }
  .person-chip.placed {
    border-color: var(--border);
    color: var(--text3);
    cursor: default;
    text-decoration: line-through;
  }

  .controls { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .btn {
    padding: 9px 20px;
    border-radius: 6px;
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    font-family: 'Noto Serif SC', serif;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--border2); color: var(--text); background: var(--surface); }
  .btn-primary {
    background: var(--accent2);
    border-color: var(--accent);
    color: #0f0e0c;
    font-weight: 700;
  }
  .btn-primary:hover { background: var(--accent); }
  .btn-danger { border-color: #4a2a2a; color: var(--red); }
  .btn-danger:hover { background: #1a1111; }

  .result-bar {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    display: none;
    border: 1px solid;
    margin-top: 4px;
  }
  .result-bar.show { display: block; }
  .result-bar.success { background: #111a13; border-color: var(--green); color: var(--green); }
  .result-bar.fail { background: #1a1111; border-color: var(--red); color: #e8a0a0; }
  .result-bar.info { background: #1a1e14; border-color: var(--accent2); color: var(--accent); }

  .instructions {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 12px;
    color: var(--text3);
    line-height: 1.8;
    margin-bottom: 20px;
  }
  .instructions strong { color: var(--text2); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">逻辑推理 · 全量超硬核版</div>
  <div class="topbar-meta">
    <span>当前得分 <span class="meta-val" id="score-display">100</span></span>
    <span>求助提示 <span class="meta-val" id="hint-count">0</span> 次</span>
    <span>分级判定 <span class="meta-val" style="color:var(--red); font-weight:bold;">🔥极限烧脑</span></span>
  </div>
</div>

<div class="puz-selector" id="puz-selector"></div>

<div class="main">
  <div class="clues-panel">
    <div class="panel-label">已知蛛丝马迹</div>
    <div id="clue-list"></div>
  </div>
  <div class="right-panel">
    <div class="scene-header">
      <div class="scene-title" id="scene-title"></div>
      <div class="scene-desc" id="scene-desc"></div>
    </div>

    <div class="instructions">
      <strong>终极法则：</strong> 先点选下方待安置人员的姓名（变为金色高亮），然后点击上方的矩阵格子锁定座位。点击已被占用的格子可将其覆盖或清空。按【验证答案】检查，错误将重扣 <strong>10分</strong>。
    </div>

    <div class="grid-wrapper">
      <div class="grid-legend" id="grid-legend"></div>
      <div class="seat-grid" id="seat-grid"></div>
    </div>

    <div class="tray-label">待定编制人员</div>
    <div class="people-tray" id="people-tray"></div>

    <div class="controls">
      <button class="btn btn-primary" onclick="checkAnswer()">验证推理结果</button>
      <button class="btn" onclick="showHint()">💡 获取一线情报 (−5分)</button>
      <button class="btn btn-danger" onclick="clearAll()">洗牌重来</button>
    </div>
    <div class="result-bar" id="result-bar"></div>
  </div>
</div>

<script>
const PUZZLES = [
  {
    id: 0,
    name: "第一题：教室座位",
    desc: "6人 · 3排2列课室 · 入门级唯一解推断",
    people: ["小华","小丽","阿明","婷婷","大雄","珊珊"],
    rows: 3, cols: 2,
    windowCols: [1], aisleCols: [], frontRows: [0], backRows: [2],
    labelFn: (r,c) => `第${r+1}排 ${c===0?'左':'右'}`,
    tagsFn: (r,c) => {
      let t = [];
      if (c===1) t.push({text:"靠窗", cls:"win"});
      if (r===0) t.push({text:"前排", cls:"front"});
      if (r===2) t.push({text:"后排", cls:""});
      return t;
    },
    solution: { "小华":[1,0], "小丽":[0,1], "阿明":[2,0], "婷婷":[1,1], "大雄":[2,1], "珊珊":[0,0] },
    clues: [
      "小华坐在走廊侧（左列），并且他既不在第一排也不在最后一排。",
      "小丽只坐靠窗位（右列），且她必须坐在前排（第一排）。",
      "阿明和小华同在左列，且阿明的排号比小华的排号要大。",
      "大雄强烈要求不坐前排和中排，他锁定了靠窗列的最后一个位置。",
      "珊珊和婷婷里，只有一个人坐在靠窗列。其中婷婷正坐在小丽的正后方。",
      "【大局推导】利用排号的相互大小链条，可以瞬间确定所有左列走廊的排布。"
    ],
    hints: [
      "小丽根据线索直接锁定在[第一排右列]。",
      "婷婷在小丽正后方，所以只能是[第二排右列]。",
      "大雄明确在靠窗最后一排，即[第三排右列]。至此右侧全部锁死。"
    ]
  },
  {
    id: 1,
    name: "第二题：飞机舱位",
    desc: "8人 · 4排A/B双座 · 多重依赖链式咬合",
    people: ["陈总","林秘","王工","李博","赵医","钱律","孙导","周编"],
    rows: 4, cols: 2,
    windowCols: [1], aisleCols: [0], frontRows: [0], backRows: [3],
    labelFn: (r,c) => `${r+1}排${['A','B'][c]}`,
    tagsFn: (r,c) => {
      let t = [];
      if (c===1) t.push({text:"窗边", cls:"win"});
      if (c===0) t.push({text:"走廊", cls:"ais"});
      if (r===0) t.push({text:"头等", cls:"front"});
      return t;
    },
    solution: { "陈总":[0,1], "林秘":[0,0], "王工":[2,0], "李博":[1,1], "赵医":[3,0], "钱律":[1,0], "孙导":[2,1], "周编":[3,1] },
    clues: [
      "陈总坚持坐第一排靠窗（1排B）。其秘书林秘必须坐在同排走廊位（1排A）。",
      "钱律坐走廊侧，他是所有走廊乘客中排号最靠前的非头等舱乘客。",
      "王工也坐走廊，且王工的排号刚好比钱律多1（紧挨着钱律后方）。",
      "李博坐窗边，他前后都有人坐（意味着他不能在第1排或第4排）。",
      "孙导坐在李博的正后方（同在窗边列，排号比李博多1）。",
      "赵医坐在全机最后排的走廊位，而周编坐在他同排的窗边位置。"
    ],
    hints: [
      "钱律是走廊中最靠前的非头等，所以钱律必然在[2排A]。",
      "由王工紧挨钱律后方，可直接推导出王工在[3排A]。",
      "李博前后有人且在窗边，只能坐在[2排B]；孙导在其后，则固定在[3排B]。"
    ]
  },
  {
    id: 2,
    name: "第三题：圆桌会议",
    desc: "7人 · 环形座1-7号 · 循环模运算与对称破局",
    people: ["董事长","CFO","CTO","法务","市场","运营","HR"],
    rows: 7, cols: 1,
    windowCols: [], aisleCols: [], frontRows: [0], backRows: [],
    labelFn: (r,c) => `${r+1}号座`,
    tagsFn: (r,c) => {
      let t = [];
      if (r===0) t.push({text:"首席", cls:"front"});
      if (r===3) t.push({text:"对立面", cls:""});
      return t;
    },
    solution: { "董事长":[0,0], "法务":[1,0], "CFO":[2,0], "HR":[3,0], "CTO":[4,0], "市场":[5,0], "运营":[6,0] },
    clues: [
      "董事长固定在圆桌起点的 1号主位。",
      "法务坐在董事长顺时针的下一个位置（2号座）。",
      "CFO的座位号紧随法务其后，等于法务的号数加1。",
      "HR坐在董事长的绝对正对位。在7人圆桌中，1号的正对位是 4号。",
      "CTO不坐任何偶数号座位，且他与HR在圆桌上是紧挨着的邻座。",
      "市场与运营两人位置相邻，且两人的座位号都必须在 5、6、7 中产生。"
    ],
    hints: [
      "法务在2号，CFO在法务加1，所以CFO在[3号座]。",
      "HR在正对位，固定在[4号座]。",
      "CTO和HR紧挨着（可能是3或5），但3已被CFO占用，且CTO不能是偶数，故CTO在[5号座]。"
    ]
  },
  {
    id: 3,
    name: "第四题：深夜酒馆（地狱极难）",
    desc: "9人 · 3×3九宫方阵 · 八向邻接拓扑关系综合推理",
    people: ["酒保","诗人","赏金猎人","刺客","法师","骑士","学者","商贾","盗贼"],
    rows: 3, cols: 3,
    windowCols: [0, 2], aisleCols: [1], frontRows: [0], backRows: [2],
    labelFn: (r,c) => `行${r+1} 列${c+1}`,
    tagsFn: (r,c) => {
      let t = [];
      if (r===1 && c===1) t.push({text:"核心枢纽", cls:"front"});
      if ((r+c)%2===0 && !(r===1 && c===1)) t.push({text:"角落", cls:"win"});
      return t;
    },
    solution: { "酒保":[1,1], "诗人":[0,0], "学者":[0,1], "骑士":[0,2], "商贾":[1,0], "法师":[1,2], "盗贼":[2,0], "赏金猎人":[2,1], "刺客":[2,2] },
    clues: [
      "酒保在小酒馆的正中央枢纽位置（行2列2），负责看护四方。",
      "诗人坐在左上角的角落，而刺客坐在与诗人呈对角线遥遥相望的右下角。",
      "学者坐在第一排，他的左右两边分别坐着商贾和法师（注意：这两人不一定在同一行）。",
      "骑士坐在右上角的角落。法师和骑士在同一列，且直接上下相邻。",
      "赏金猎人坐在最后一排，他和酒保在同一列，且直接上下相邻。",
      "盗贼是个危险人物，他必须和商贾相邻（上下或左右），但绝对不能和酒保相邻（包括对角线）。",
      "【约束】除了酒保，所有奇数行奇数列交叉点的角落里，都坐着战斗系或艺术系职业。"
    ],
    hints: [
      "酒保固定在[1,1]，诗人固定在[0,0]，刺客固定在[2,2]。",
      "骑士固定在右上角[0,2]。由于法师与骑士同列且相邻，法师必在[1,2]。",
      "学者在第一排且在商贾与法师之间（这里的之间指逻辑或列关联），由法师在[1,2]与第一排的关系结合，学者必在[0,1]，进而逼出商贾在[1,0]。"
    ]
  },
  {
    id: 4,
    name: "第五题：天眼机房（终极湮灭）",
    desc: "6人 · 4×3异形机房 · 曼哈顿距离约束与极值破局",
    people: ["代号Alpha","代号Beta","代号Gamma","核心宿主","清理者","观察员"],
    rows: 4, cols: 3,
    windowCols: [0], aisleCols: [2], frontRows: [0], backRows: [3],
    labelFn: (r,c) => `控制台 R${r+1}-C${c+1}`,
    tagsFn: (r,c) => {
      let t = [];
      if (r===0 && c===0) t.push({text:"主控端", cls:"front"});
      if (r===3 && c===2) t.push({text:"死角端", cls:"win"});
      return t;
    },
    solution: { "核心宿主":[0,0], "观察员":[0,2], "代号Alpha":[1,1], "代号Beta":[2,0], "代号Gamma":[2,2], "清理者":[3,1] },
    clues: [
      "核心宿主占据了主控端端点（行1列1），其安全级别最高。",
      "观察员和核心宿主处在同一行，但处于走廊的最右侧（列3）。",
      "代号Alpha位于机房几何正中心点的两个备选位之一，满足其行号等于列号，且不与任何人在同一行或同一列。",
      "清理者和代号Alpha在同一列，且清理者位于全机房的最后一排（行4）。",
      "【曼哈顿距离核心约束】代号Beta和代号Gamma所在的行号完全相同。并且，代号Beta到核心宿主的曼哈顿步数距离，与代号Gamma到观察员的曼哈顿步数距离完全相等，且均为最小值 2 步。",
      "【绝对禁忌】没有任何两名特工可以坐在直接相邻的格子内（八向均不相邻，除了固定死的主控配置）。"
    ],
    hints: [
      "核心宿主锁定在[0,0]，观察员锁定在[0,2]。",
      "清理者在最后一排且与Alpha同列。由于Alpha满足行=列，且不能与宿主/观察员同行列，Alpha只能在[1,1]，则清理者在[3,1]。",
      "Beta和Gamma同排。Beta到[0,0]距离为2，只能在[2,0]或[1,1](已占)或[0,2](已占)。故Beta在[2,0]。为了保持对称距离2且同排，Gamma必在[2,2]。"
    ]
  }
];

let currentPuzIdx = 0;
let selectedPerson = null;
let placement = {};
let score = 100;
let hintCount = 0;
let usedHintCount = 0;

function getPuz() { return PUZZLES[currentPuzIdx]; }

function initSelector() {
  const el = document.getElementById('puz-selector');
  el.innerHTML = '';
  PUZZLES.forEach((p,i) => {
    const b = document.createElement('button');
    b.className = 'puz-tab' + (i===currentPuzIdx?' active':'');
    b.textContent = p.name;
    b.onclick = () => { currentPuzIdx = i; resetPuzzle(); };
    el.appendChild(b);
  });
}

function resetPuzzle() {
  placement = {};
  selectedPerson = null;
  score = 100;
  hintCount = 0;
  usedHintCount = 0;
  document.getElementById('score-display').textContent = score;
  document.getElementById('hint-count').textContent = hintCount;
  document.getElementById('result-bar').className = 'result-bar';
  initSelector();
  renderClues();
  renderHeader();
  renderGrid();
  renderTray();
}

function renderHeader() {
  const puz = getPuz();
  document.getElementById('scene-title').textContent = puz.name;
  document.getElementById('scene-desc').textContent = puz.desc;
}

function renderClues() {
  const puz = getPuz();
  const el = document.getElementById('clue-list');
  el.innerHTML = '';
  puz.clues.forEach((c,i) => {
    const d = document.createElement('div');
    d.className = 'clue-item';
    d.id = 'clue-' + i;
    d.innerHTML = `<span class="clue-num">${String(i+1).padStart(2,'0')}</span><span class="clue-text">${c}</span>`;
    el.appendChild(d);
  });
}

function renderGrid() {
  const puz = getPuz();
  const { rows, cols, windowCols, aisleCols } = puz;

  const legend = document.getElementById('grid-legend');
  legend.innerHTML = '';
  if (windowCols.length) legend.innerHTML += `<div class="legend-item"><div class="legend-pip" style="background:var(--window-color)"></div>特殊限制区A</div>`;
  if (aisleCols.length) legend.innerHTML += `<div class="legend-item"><div class="legend-pip" style="background:var(--aisle-color)"></div>特殊限制区B</div>`;
  legend.innerHTML += `<div class="legend-item" style="margin-left:auto; font-size:11px; color:var(--text3)">内部席位总数: ${rows*cols}</div>`;

  const grid = document.getElementById('seat-grid');
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.innerHTML = '';

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'seat';
      if (windowCols.includes(c)) cell.classList.add('window-seat');
      if (aisleCols.includes(c)) cell.classList.add('aisle-seat');
      cell.dataset.r = r; cell.dataset.c = c;

      const tags = puz.tagsFn(r, c);
      const placed = Object.entries(placement).find(([,pos]) => pos[0]===r && pos[1]===c);
      const tagsHtml = tags.map(t => `<span class="seat-tag ${t.cls}">${t.text}</span>`).join('');

      cell.innerHTML = `
        <div class="seat-top">
          <span class="seat-id">${puz.labelFn(r,c)}</span>
          <div class="seat-tags">${tagsHtml}</div>
        </div>
        <div class="seat-person ${placed?'':'empty'}">${placed ? placed[0] : '【真空未落座】'}</div>
      `;

      if (selectedPerson) {
        if (placed && placed[0] === selectedPerson) {
          cell.classList.add('targeted');
        } else if (!placed) {
          cell.classList.add('targeted');
        }
      }
      cell.onclick = () => seatClick(r, c);
      grid.appendChild(cell);
    }
  }
}

function renderTray() {
  const puz = getPuz();
  const tray = document.getElementById('people-tray');
  tray.innerHTML = '';
  puz.people.forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'person-chip';
    if (placement[p] !== undefined) chip.classList.add('placed');
    if (selectedPerson === p) chip.classList.add('active');
    chip.textContent = p;
    chip.onclick = () => {
      selectedPerson = (selectedPerson === p) ? null : p;
      renderGrid();
      renderTray();
    };
    tray.appendChild(chip);
  });
}

function seatClick(r, c) {
  if (!selectedPerson) {
    // 允许直接点击座位上的已有人员进行回收起飞
    const existing = Object.entries(placement).find(([,pos]) => pos[0]===r && pos[1]===c);
    if (existing) {
      delete placement[existing[0]];
      renderGrid();
      renderTray();
    }
    return;
  }
  
  // 踢掉这个座位上原本存在的人
  const existing = Object.entries(placement).find(([,pos]) => pos[0]===r && pos[1]===c);
  if (existing) {
    delete placement[existing[0]];
  }

  placement[selectedPerson] = [r, c];
  selectedPerson = null;
  renderGrid();
  renderTray();
}

function checkAnswer() {
  const puz = getPuz();
  if (Object.keys(placement).length < puz.people.length) {
    showResult('fail', `情报严重残缺！还有 ${puz.people.length - Object.keys(placement).length} 关键人员流落在外，无法合龙推演！`);
    return;
  }
  let wrong = [];
  puz.people.forEach(p => {
    const s = puz.solution[p];
    const a = placement[p];
    if (!a || a[0] !== s[0] || a[1] !== s[1]) wrong.push(p);
  });
  
  document.querySelectorAll('.seat').forEach(cell => {
    cell.classList.remove('correct','wrong');
    const r = +cell.dataset.r, c = +cell.dataset.c;
    const placed = Object.entries(placement).find(([,pos]) => pos[0]===r && pos[1]===c);
    if (placed) {
      const s = puz.solution[placed[0]];
      if (s[0]===r && s[1]===c) cell.classList.add('correct');
      else cell.classList.add('wrong');
    }
  });

  if (wrong.length === 0) {
    showResult('success', `🏆 湮灭级神之推理！完美符合全部强力拓扑链约束。最终斩获积分：${score} 分`);
  } else {
    score = Math.max(0, score - 10);
    document.getElementById('score-display').textContent = score;
    showResult('fail', `💥 逻辑冲突！共有 ${wrong.length} 处排布引发了悖论链条。系统已扣除10分，剩余：${score} 分。`);
  }
}

function clearAll() {
  placement = {};
  selectedPerson = null;
  document.getElementById('result-bar').className = 'result-bar';
  renderGrid();
  renderTray();
}

function showHint() {
  const puz = getPuz();
  if (usedHintCount >= puz.hints.length) {
    showResult('info', '前线情报已全部竭尽！剩下的断层只能依靠你无懈可击的大脑神级推演。');
    return;
  }
  const h = puz.hints[usedHintCount];
  usedHintCount++;
  hintCount++;
  score = Math.max(0, score - 5);
  document.getElementById('hint-count').textContent = hintCount;
  document.getElementById('score-display').textContent = score;
  showResult('info', `【绝密档案泄漏 ${hintCount}】：${h}`);
}

function showResult(type, msg) {
  const bar = document.getElementById('result-bar');
  bar.className = `result-bar show ${type}`;
  bar.textContent = msg;
}

resetPuzzle();
</script>
</body>
</html>
