<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逻辑推理 · 座位安排</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e0c;
    --surface: #1a1916;
    --surface2: #222018;
    --border: #2e2c28;
    --border2: #3d3a34;
    --text: #e8e4d8;
    --text2: #9a9488;
    --text3: #5c5a54;
    --accent: #c8a96e;
    --accent2: #9b7c45;
    --green: #6aab7a;
    --red: #c46060;
    --blue: #6b92c8;
    --window-color: #6aab7a;
    --aisle-color: #c8a96e;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Serif SC', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .topbar-meta {
    display: flex;
    gap: 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text2);
  }
  .meta-val { color: var(--text); font-weight: 600; }

  .puz-selector {
    display: flex;
    gap: 0;
    padding: 0 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .puz-tab {
    padding: 14px 24px;
    font-family: 'Noto Serif SC', serif;
    font-size: 13px;
    color: var(--text2);
    cursor: pointer;
    border: none;
    background: none;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .puz-tab:hover { color: var(--text); }
  .puz-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .main {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 0;
    min-height: calc(100vh - 105px);
  }

  .clues-panel {
    border-right: 1px solid var(--border);
    background: var(--surface);
    padding: 28px 24px;
    overflow-y: auto;
    max-height: calc(100vh - 105px);
    position: sticky;
    top: 105px;
  }
  .panel-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .clue-item {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    transition: all 0.2s;
    cursor: default;
  }
  .clue-item:last-child { border-bottom: none; }
  .clue-item.used .clue-text { color: var(--text3); text-decoration: line-through; }
  .clue-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent2);
    min-width: 20px;
    padding-top: 2px;
  }
  .clue-text {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text2);
  }
  .clue-item:hover .clue-text { color: var(--text); }

  .right-panel {
    padding: 28px 32px;
    overflow-y: auto;
    max-height: calc(100vh - 105px);
  }

  .scene-header { margin-bottom: 24px; }
  .scene-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }
  .scene-desc { font-size: 13px; color: var(--text2); }

  .grid-wrapper {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .grid-legend {
    display: flex;
    gap: 20px;
    margin-bottom: 16px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
  }
  .legend-pip { width: 16px; height: 3px; border-radius: 2px; }

  .seat-grid { display: grid; gap: 8px; }
  .seat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    min-height: 62px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .seat:hover { border-color: var(--border2); background: #201e1b; }
  .seat.window-seat { border-top: 2px solid var(--window-color); }
  .seat.aisle-seat { border-left: 2px solid var(--aisle-color); }
  .seat.targeted {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
    background: #201e14;
  }
  .seat.correct { border-color: var(--green); background: #111a13; }
  .seat.wrong { border-color: var(--red); background: #1a1111; }
  .seat-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .seat-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text3);
  }
  .seat-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .seat-tag {
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--border);
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
  }
  .seat-tag.win { background: #1a2e1e; color: var(--window-color); }
  .seat-tag.ais { background: #2a2412; color: var(--aisle-color); }
  .seat-tag.front { background: #1a1e2e; color: var(--blue); }
  .seat-person {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-top: 6px;
    min-height: 22px;
  }
  .seat-person.empty { color: var(--border2); font-weight: 400; font-size: 12px; }

  .tray-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .people-tray {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }
  .person-chip {
    padding: 7px 16px;
    border: 1px solid var(--border2);
    border-radius: 99px;
    font-size: 14px;
    cursor: pointer;
    background: var(--surface);
    color: var(--text);
    transition: all 0.15s;
    font-family: 'Noto Serif SC', serif;
  }
  .person-chip:hover { border-color: var(--accent2); color: var(--accent); }
  .person-chip.active {
    background: var(--accent2);
    border-color: var(--accent);
    color: #0f0e0c;
    font-weight: 700;
    box-shadow: 0 0 12px rgba(200,169,110,0.3);
  }
  .person-chip.placed {
    border-color: var(--border);
    color: var(--text3);
    cursor: default;
    text-decoration: line-through;
  }
  .person-chip.placed:hover { border-color: var(--border); color: var(--text3); }

  .controls { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .btn {
    padding: 9px 20px;
    border-radius: 6px;
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    font-family: 'Noto Serif SC', serif;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--border2); color: var(--text); background: var(--surface); }
  .btn-primary {
    background: var(--accent2);
    border-color: var(--accent);
    color: #0f0e0c;
    font-weight: 700;
  }
  .btn-primary:hover { background: var(--accent); }
  .btn-danger { border-color: #4a2a2a; color: var(--red); }
  .btn-danger:hover { background: #1a1111; }

  .result-bar {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    display: none;
    border: 1px solid;
    margin-top: 4px;
  }
  .result-bar.show { display: block; }
  .result-bar.success { background: #111a13; border-color: var(--green); color: var(--green); }
  .result-bar.fail { background: #1a1111; border-color: var(--red); color: #e8a0a0; }
  .result-bar.info { background: #1a1e14; border-color: var(--accent2); color: var(--accent); }

  .instructions {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 12px;
    color: var(--text3);
    line-height: 1.8;
    margin-bottom: 20px;
  }
  .instructions strong { color: var(--text2); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">逻辑推理 · 座位安排</div>
  <div class="topbar-meta">
    <span>得分 <span class="meta-val" id="score-display">100</span></span>
    <span>提示 <span class="meta-val" id="hint-count">0</span> 次</span>
    <span>难度 <span class="meta-val" style="color:var(--red)">烧脑硬核</span></span>
  </div>
</div>

<div class="puz-selector" id="puz-selector"></div>

<div class="main">
  <div class="clues-panel">
    <div class="panel-label">线索清单</div>
    <div id="clue-list"></div>
  </div>
  <div class="right-panel">
    <div class="scene-header">
      <div class="scene-title" id="scene-title"></div>
      <div class="scene-desc" id="scene-desc"></div>
    </div>

    <div class="instructions">
      <strong>玩法：</strong> 点选下方人名（高亮）→ 点击座位格安置。验证错误扣 <strong>10分</strong>，每次提示扣 <strong>5分</strong>。
    </div>

    <div class="grid-wrapper">
      <div class="grid-legend" id="grid-legend"></div>
      <div class="seat-grid" id="seat-grid"></div>
    </div>

    <div class="tray-label">待安置人员</div>
    <div class="people-tray" id="people-tray"></div>

    <div class="controls">
      <button class="btn btn-primary" onclick="checkAnswer()">验证答案</button>
      <button class="btn" onclick="showHint()">💡 提示 (−5分)</button>
      <button class="btn btn-danger" onclick="clearAll()">清除重来</button>
    </div>
    <div class="result-bar" id="result-bar"></div>
  </div>
</div>

<script>
const PUZZLES = [
  {
    id: 0,
    name: "教室座位",
    desc: "6人 · 3排2列课室 · 推断唯一解",
    people: ["小华","小丽","阿明","婷婷","大雄","珊珊"],
    rows: 3, cols: 2,
    windowCols: [1], aisleCols: [], frontRows: [0], backRows: [2],
    labelFn: (r,c) => `第${r+1}排 ${c===0?'左':'右'}`,
    tagsFn: (r,c) => {
      let t = [];
      if (c===1) t.push({text:"靠窗", cls:"win"});
      if (r===0) t.push({text:"前排", cls:"front"});
      if (r===2) t.push({text:"后排", cls:""});
      if (r===1) t.push({text:"中排", cls:""});
      return t;
    },
    solution: { "小华":[1,0], "小丽":[0,1], "阿明":[2,0], "婷婷":[0,0], "大雄":[2,1], "珊珊":[1,1] },
    clues: [
      "小华坐在走廊侧（左列），他的排号既不是最前也不是最后——他在中间某排。",
      "小丽只愿意坐靠窗座位，且她要求坐在全班最前面那一排。",
      "阿明坐在每排最左侧（走廊侧），且阿明所在排号严格大于小华的排号。",
      "婷婷坐在小丽的正前方同一列——两人同列相邻排，婷婷排号比小丽小1。（注意：婷婷在第几排？）",
      "大雄不坐前排也不坐中排，他坐在靠窗那侧的最后一排。",
      "珊珊不在最前排也不在最后排，她坐右列（靠窗列）。",
      "【交叉验证】小华与阿明都在左列，而阿明排号 > 小华排号 > 0（非最前）。可能排号组合只有一种，请枚举出来。",
    ],
    hints: [
      "小丽 → 第1排右列（靠窗且最前，线索2直接给出）",
      "婷婷 → 线索4说婷婷在小丽正前方，排号比小丽小1。小丽在第1排(r=0)，r-1=-1不存在！重读：应是婷婷在小丽「正后方」，排号=小丽+1=第2排(r=1)，右列已被珊珊占……继续推！",
      "大雄 → 第3排右列(r=2, c=1)，最后排靠窗，线索5直接给出",
    ]
  },
  {
    id: 1,
    name: "飞机舱位",
    desc: "8人 · 4排A/B双座 · 多重依赖链",
    people: ["陈总","林秘","王工","李博","赵医","钱律","孙导","周编"],
    rows: 4, cols: 2,
    windowCols: [1], aisleCols: [0], frontRows: [0], backRows: [3],
    labelFn: (r,c) => `${r+1}排${['A','B'][c]}`,
    tagsFn: (r,c) => {
      let t = [];
      if (c===1) t.push({text:"窗边", cls:"win"});
      if (c===0) t.push({text:"走廊", cls:"ais"});
      if (r===0) t.push({text:"头等", cls:"front"});
      if (r===3) t.push({text:"末排", cls:""});
      return t;
    },
    solution: { "陈总":[0,1], "林秘":[0,0], "王工":[2,0], "李博":[1,1], "赵医":[3,0], "钱律":[1,0], "孙导":[2,1], "周编":[3,1] },
    clues: [
      "陈总坚持坐靠窗座（B列），且必须在最前排（第1排）——已付头等舱升舱费。",
      "林秘必须与陈总同排以便随时服务，但林秘坐走廊座（A列）。",
      "钱律坐走廊座（A列），且他是所有走廊乘客中排号最靠前的非头等乘客。",
      "王工也坐走廊座（A列），且王工的排号 = 钱律的排号 + 1（紧邻后排）。",
      "李博坐靠窗（B列），不坐最前排也不坐最后排，且李博前后各有人（他不在边排）。",
      "孙导坐在李博的正后方，同为B列——两人紧邻，孙导排号 = 李博排号 + 1。",
      "赵医不坐靠窗座，他坐在飞机最末排。",
      "周编坐在赵医同排的靠窗座（B列）。",
    ],
    hints: [
      "陈总→1排B，林秘→1排A（线索1、2直接给出，头等舱占满）",
      "钱律→2排A（走廊中最靠前的非头等，故第2排），王工→3排A（钱律+1排）",
      "李博→2排B（靠窗非边排，2排是唯一选项），孙导→3排B（李博正后方）",
    ]
  },
  {
    id: 2,
    name: "圆桌会议",
    desc: "7人 · 环形座1-7号 · 模运算+路径推理",
    people: ["董事长","CFO","CTO","法务","市场","运营","HR"],
    rows: 7, cols: 1,
    windowCols: [], aisleCols: [], frontRows: [0], backRows: [],
    labelFn: (r,c) => `${r+1}号座`,
    tagsFn: (r,c) => {
      let t = [];
      if (r===0) t.push({text:"主位", cls:"front"});
      if (r===3) t.push({text:"对主位", cls:""});
      return t;
    },
    solution: { "董事长":[0,0], "法务":[1,0], "CFO":[2,0], "HR":[3,0], "CTO":[4,0], "市场":[5,0], "运营":[6,0] },
    clues: [
      "董事长坐1号主位（圆桌起点，固定）。",
      "法务坐在董事长顺时针紧邻的下一个位置（即2号座），随时低声咨询。",
      "CFO的座位号 = 法务座位号 + 1（顺时针再走一步），但若超过7则回到1。",
      "HR坐在圆桌上与董事长正对的位置——7个座位时，正对为第4号（1对4，2对5，以此类推）。",
      "CTO不坐偶数号座，且CTO与HR之间的最短圆弧距离恰好为1个座位（紧邻）。",
      "市场与运营相邻（最短路径距离为1），且两人均坐在5、6、7号三座中。",
      "【终极推导】确认所有7人位置后，验证：CFO与CTO之间的最短路径距离是否 ≥ 2？（即两人不相邻，这是合法约束）",
    ],
    hints: [
      "董事长→1号，法务→2号，CFO→3号（由线索1、2、3依次推出）",
      "HR→4号（董事长正对位，线索4直接给出）",
      "CTO→5号（不坐偶数且与HR紧邻，HR在4号，紧邻是3号和5号，3号被CFO占，故5号）",
    ]
  }
];

let currentPuzIdx = 0;
let selectedPerson = null;
let placement = {};
let score = 100;
let hintCount = 0;
let usedHintCount = 0;

function getPuz() { return PUZZLES[currentPuzIdx]; }

function initSelector() {
  const el = document.getElementById('puz-selector');
  el.innerHTML = '';
  PUZZLES.forEach((p,i) => {
    const b = document.createElement('button');
    b.className = 'puz-tab' + (i===currentPuzIdx?' active':'');
    b.textContent = `${['第一题','第二题','第三题'][i]}：${p.name}`;
    b.onclick = () => { currentPuzIdx = i; resetPuzzle(); };
    el.appendChild(b);
  });
}

function resetPuzzle() {
  placement = {};
  selectedPerson = null;
  score = 100;
  hintCount = 0;
  usedHintCount = 0;
  document.getElementById('score-display').textContent = score;
  document.getElementById('hint-count').textContent = hintCount;
  document.getElementById('result-bar').className = 'result-bar';
  initSelector();
  renderClues();
  renderHeader();
  renderGrid();
  renderTray();
}

function renderHeader() {
  const puz = getPuz();
  document.getElementById('scene-title').textContent = puz.name;
  document.getElementById('scene-desc').textContent = puz.desc;
}

function renderClues() {
  const puz = getPuz();
  const el = document.getElementById('clue-list');
  el.innerHTML = '';
  puz.clues.forEach((c,i) => {
    const d = document.createElement('div');
    d.className = 'clue-item';
    d.id = 'clue-' + i;
    d.innerHTML = `<span class="clue-num">${String(i+1).padStart(2,'0')}</span><span class="clue-text">${c}</span>`;
    el.appendChild(d);
  });
}

function renderGrid() {
  const puz = getPuz();
  const { rows, cols, windowCols, aisleCols } = puz;

  const legend = document.getElementById('grid-legend');
  legend.innerHTML = '';
  if (windowCols.length) legend.innerHTML += `<div class="legend-item"><div class="legend-pip" style="background:var(--window-color)"></div>靠窗</div>`;
  if (aisleCols.length) legend.innerHTML += `<div class="legend-item"><div class="legend-pip" style="background:var(--aisle-color)"></div>走廊</div>`;
  legend.innerHTML += `<div class="legend-item" style="margin-left:auto; font-size:11px; color:var(--text3)">共 ${rows*cols} 个座位</div>`;

  const grid = document.getElementById('seat-grid');
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.innerHTML = '';

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'seat';
      if (windowCols.includes(c)) cell.classList.add('window-seat');
      if (aisleCols.includes(c)) cell.classList.add('aisle-seat');
      cell.dataset.r = r; cell.dataset.c = c;

      const tags = puz.tagsFn(r, c);
      const placed = Object.entries(placement).find(([,pos]) => pos[0]===r && pos[1]===c);
      const tagsHtml = tags.map(t => `<span class="seat-tag ${t.cls}">${t.text}</span>`).join('');

      cell.innerHTML = `
        <div class="seat-top">
          <span class="seat-id">${puz.labelFn(r,c)}</span>
          <div class="seat-tags">${tagsHtml}</div>
        </div>
        <div class="seat-person ${placed?'':'empty'}">${placed ? placed[0] : '空置'}</div>
      `;

      if (selectedPerson && !placed) cell.classList.add('targeted');
      cell.onclick = () => seatClick(r, c);
      grid.appendChild(cell);
    }
  }
}

function renderTray() {
  const puz = getPuz();
  const tray = document.getElementById('people-tray');
  tray.innerHTML = '';
  puz.people.forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'person-chip';
    if (placement[p] !== undefined) chip.classList.add('placed');
    else if (selectedPerson === p) chip.classList.add('active');
    chip.textContent = p;
    chip.onclick = () => {
      if (placement[p] !== undefined) return;
      selectedPerson = (selectedPerson === p) ? null : p;
      renderGrid();
      renderTray();
    };
    tray.appendChild(chip);
  });
}

function seatClick(r, c) {
  if (!selectedPerson) return;
  const existing = Object.entries(placement).find(([,pos]) => pos[0]===r && pos[1]===c);
  if (existing) delete placement[existing[0]];
  placement[selectedPerson] = [r, c];
  selectedPerson = null;
  renderGrid();
  renderTray();
}

function checkAnswer() {
  const puz = getPuz();
  if (Object.keys(placement).length < puz.people.length) {
    showResult('fail', `还有 ${puz.people.length - Object.keys(placement).length} 人未安置，请先完成所有座位！`);
    return;
  }
  let wrong = [];
  puz.people.forEach(p => {
    const s = puz.solution[p];
    const a = placement[p];
    if (!a || a[0] !== s[0] || a[1] !== s[1]) wrong.push(p);
  });
  document.querySelectorAll('.seat').forEach(cell => {
    cell.classList.remove('correct','wrong');
    const r = +cell.dataset.r, c = +cell.dataset.c;
    const placed = Object.entries(placement).find(([,pos]) => pos[0]===r && pos[1]===c);
    if (placed) {
      const s = puz.solution[placed[0]];
      if (s[0]===r && s[1]===c) cell.classList.add('correct');
      else cell.classList.add('wrong');
    }
  });
  if (wrong.length === 0) {
    showResult('success', `✓ 完美推理！所有座位全部正确。最终得分：${score} 分`);
  } else {
    score = Math.max(0, score - 10);
    document.getElementById('score-display').textContent = score;
    showResult('fail', `✗ ${wrong.join('、')} 位置有误（共 ${wrong.length} 人）。扣除10分，剩余 ${score} 分，再仔细推理！`);
  }
}

function clearAll() {
  placement = {};
  selectedPerson = null;
  document.getElementById('result-bar').className = 'result-bar';
  renderGrid();
  renderTray();
}

function showHint() {
  const puz = getPuz();
  if (usedHintCount >= puz.hints.length) {
    showResult('info', '提示已全部使用完！只靠推理征服最后难关吧。');
    return;
  }
  const h = puz.hints[usedHintCount];
  usedHintCount++;
  hintCount++;
  score = Math.max(0, score - 5);
  document.getElementById('hint-count').textContent = hintCount;
  document.getElementById('score-display').textContent = score;
  showResult('info', `提示 ${hintCount}：${h}`);
}

function showResult(type, msg) {
  const bar = document.getElementById('result-bar');
  bar.className = `result-bar show ${type}`;
  bar.textContent = msg;
}

resetPuzzle();
</script>

</html>
