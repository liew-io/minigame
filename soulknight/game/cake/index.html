<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Papa's Bake Station</title>
    <style>
        :root { --papas-bg: #444; --papas-gold: #ffcc00; --papas-panel: #8d6e63; }
        body { font-family: 'Arial Black', sans-serif; background: var(--papas-bg); color: #333; margin: 0; }
        #game-container { width: 800px; height: 600px; background: #eee; margin: 20px auto; position: relative; border: 8px solid #222; }

        /* 烤箱背景 */
        #bake-station { 
            width: 100%; height: 500px; 
            background: linear-gradient(to bottom, #777, #444);
            display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 40px;
        }

        /* 烤位 (Slots) */
        .oven-slot {
            width: 180px; height: 120px; background: #333; border: 4px solid #666;
            border-radius: 10px; position: relative; display: flex; align-items: center; justify-content: center;
        }
        
        /* 进度条外壳 */
        .timer-bar {
            position: absolute; bottom: -25px; width: 80%; height: 12px;
            background: #222; border-radius: 6px; overflow: hidden; border: 2px solid #666;
        }
        
        /* 动态进度条 */
        .timer-fill { width: 0%; height: 100%; background: #4caf50; transition: width 0.1s linear; }
        .perfect-zone { 
            position: absolute; right: 20%; width: 10%; height: 100%; 
            background: rgba(255, 255, 0, 0.6); border-left: 1px solid white; border-right: 1px solid white;
        }

        /* 烤箱里的物体 */
        .cake-cup { width: 60px; height: 40px; background: #e0c097; border-radius: 0 0 10px 10px; transition: transform 0.3s; }
        .baking { animation: vibrate 0.1s infinite; background: #d2a679 !important; }

        @keyframes vibrate { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(1px, -1px); } }

        /* 底部操作面板 */
        .panel { 
            height: 100px; background: var(--papas-panel); 
            display: flex; justify-content: center; align-items: center; gap: 20px;
        }
        .action-btn { padding: 15px 30px; font-weight: bold; background: var(--papas-gold); border: none; border-radius: 8px; cursor: pointer; }
        
        #ticket-side {
            position: absolute; top: 20px; right: 20px; width: 100px; background: white;
            padding: 10px; border: 2px dashed #8d6e63; transform: rotate(2deg);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ticket-side">
        <div style="font-size: 12px; text-align: center; border-bottom: 1px solid #000;">ORDER</div>
        <div id="order-target" style="font-size: 10px; padding: 5px;">饼干 x2<br>熟度: Perfect</div>
    </div>

    <div id="bake-station">
        <div class="oven-slot" id="slot-0" onclick="handleSlot(0)">
            <div class="timer-bar"><div class="perfect-zone"></div><div id="fill-0" class="timer-fill"></div></div>
            <div id="cake-0">点击放入</div>
        </div>
        <div class="oven-slot" id="slot-1" onclick="handleSlot(1)">
            <div class="timer-bar"><div class="perfect-zone"></div><div id="fill-1" class="timer-fill"></div></div>
            <div id="cake-1">点击放入</div>
        </div>
        <div class="oven-slot" id="slot-2" onclick="handleSlot(2)">
            <div class="timer-bar"><div class="perfect-zone"></div><div id="fill-2" class="timer-fill"></div></div>
            <div id="cake-2">点击放入</div>
        </div>
        <div class="oven-slot" id="slot-3" onclick="handleSlot(3)">
            <div class="timer-bar"><div class="perfect-zone"></div><div id="fill-3" class="timer-fill"></div></div>
            <div id="cake-3">点击放入</div>
        </div>
    </div>

    <div class="panel">
        <button class="action-btn" style="background: #ff5722; color: white;">ORDER STATION</button>
        <button class="action-btn">BAKE STATION</button>
        <button class="action-btn" style="background: #2196f3; color: white;">BUILD STATION</button>
    </div>
</div>

<script>
    // 烤位状态数据
    let slots = [
        { active: false, progress: 0, status: "empty" },
        { active: false, progress: 0, status: "empty" },
        { active: false, progress: 0, status: "empty" },
        { active: false, progress: 0, status: "empty" }
    ];

    function handleSlot(index) {
        let s = slots[index];
        let cake = document.getElementById(`cake-${index}`);
        let fill = document.getElementById(`fill-${index}`);

        if (s.status === "empty") {
            // 放入饼干/蛋糕
            s.status = "baking";
            s.progress = 0;
            cake.innerHTML = '<div class="cake-cup baking"></div>';
            cake.style.color = "transparent";
            startBaking(index);
        } else if (s.status === "baking") {
            // 提前取出
            finishBaking(index);
        } else if (s.status === "done") {
            // 收集成品
            s.status = "empty";
            cake.innerHTML = "点击放入";
            cake.style.color = "#ccc";
            fill.style.width = "0%";
            alert("已收集到托盘！接下来去 Build Station 组装。");
        }
    }

    function startBaking(index) {
        let s = slots[index];
        let interval = setInterval(() => {
            if (s.status !== "baking") {
                clearInterval(interval);
                return;
            }
            s.progress += 1;
            document.getElementById(`fill-${index}`).style.width = s.progress + "%";

            // 颜色变化：变深代表熟了
            if (s.progress > 70) {
                document.querySelector(`#cake-${index} .cake-cup`).style.filter = `brightness(${1 - (s.progress-70)/100})`;
            }

            // 自动烤焦逻辑
            if (s.progress >= 100) {
                s.status = "burnt";
                document.getElementById(`cake-${index}`).innerHTML = '<div class="cake-cup" style="background: #222 !important;"></div>';
                alert("烤焦了！🗑️");
                clearInterval(interval);
            }
        }, 100); // 每100毫秒更新一次
    }

    function finishBaking(index) {
        let s = slots[index];
        let score = 0;
        
        // 判定准度：70%-85% 是 Perfect Zone
        if (s.progress >= 70 && s.progress <= 85) {
            score = 100;
            alert("Perfect! 🌟 完美熟度");
        } else {
            score = 50;
            alert("熟度一般，继续努力。");
        }
        
        s.status = "done";
        document.querySelector(`#cake-${index} .cake-cup`).classList.remove("baking");
        document.getElementById(`cake-${index}`).innerHTML += `<div style="color:white; font-size:12px; position:absolute;">DONE!</div>`;
    }
</script>

</body>
</html>
