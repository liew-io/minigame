<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papa's Tiramisuria | 老爹提拉米苏店</title>
    <style>
        :root { 
            --papas-gold: #ffcc00; 
            --papas-brown: #5d4037; 
            --papas-red: #e74c3c; 
            --papas-orange: #f39c12;
        }
        
        body { 
            font-family: 'Arial Black', 'Microsoft YaHei', sans-serif; 
            background: #2c3e50; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        
        #game-container { 
            width: 800px; 
            height: 600px; 
            background: #ecf0f1; 
            position: relative; 
            border: 12px solid #34495e; 
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* 顶部看板 */
        .header { 
            height: 50px; 
            background: #34495e; 
            color: white; 
            display: flex; 
            align-items: center; 
            padding: 0 25px; 
            justify-content: space-between;
            font-size: 18px;
        }

        /* 状态控制 */
        .station { display: none; width: 100%; height: 490px; position: relative; }
        .active { display: block; }

        /* --- BAKE STATION (烘烤站) --- */
        #bake-view { 
            background: radial-gradient(circle, #444, #222); 
            display: flex; 
            justify-content: center; 
            align-content: center; 
            flex-wrap: wrap; 
            gap: 40px; 
        }
        
        .oven-slot {
            width: 180px; 
            height: 120px; 
            background: #1a1a1a; 
            border: 5px solid #555; 
            border-radius: 12px;
            position: relative; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            transition: 0.2s;
            box-shadow: inset 0 0 20px rgba(255,100,0,0.1);
        }
        .oven-slot:hover { border-color: var(--papas-gold); }
        .oven-slot.cooking { box-shadow: inset 0 0 30px rgba(255,100,0,0.4); }

        .timer-bar { 
            position: absolute; 
            bottom: -25px; 
            width: 100%; 
            height: 14px; 
            background: #111; 
            border-radius: 7px; 
            border: 2px solid #555;
            overflow: hidden; 
        }
        .timer-fill { width: 0%; height: 100%; background: #2ecc71; transition: width 0.05s linear; }
        .perfect-zone { 
            position: absolute; 
            left: 75%; 
            width: 15%; 
            height: 100%; 
            background: rgba(255, 255, 255, 0.3); 
            border-left: 2px solid white; 
            border-right: 2px solid white;
            z-index: 2;
        }

        /* --- BUILD STATION (组装站) --- */
        #build-view { background: #dfd3c3; background-image: radial-gradient(#d0bca0 1px, transparent 1px); background-size: 20px 20px; }
        #cup-area {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            width: 180px; height: 240px; border: 6px solid var(--papas-brown);
            border-top: none; border-radius: 0 0 20px 20px; background: rgba(255,255,255,0.4);
            display: flex; flex-direction: column-reverse; padding: 5px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .layer { 
            width: 95%; height: 35px; margin: 1px auto; border-radius: 5px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: white; text-shadow: 1px 1px 2px #000;
            animation: dropIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes dropIn { from { transform: translateY(-100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* 食材按钮 */
        .ingredient-tray {
            position: absolute; bottom: 15px; width: 100%; display: flex; 
            justify-content: center; gap: 15px;
        }
        .ing-btn { 
            padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; 
            font-weight: bold; color: white; box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            transition: 0.1s;
        }
        .ing-btn:active { transform: translateY(3px); box-shadow: none; }
        .color-1 { background: #e0c097; } .color-2 { background: #fff9c4; color: #5d4037; } .color-3 { background: #4e342e; }

        /* 导航栏 */
        .nav { position: absolute; bottom: 0; width: 100%; height: 60px; background: #34495e; display: flex; }
        .nav-btn { 
            flex: 1; border: none; background: #2c3e50; color: white; 
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .nav-btn.active-btn { background: var(--papas-gold); color: #2c3e50; }

        /* 订单票据 */
        #ticket { 
            position: absolute; top: 10px; right: 25px; width: 120px; background: white; 
            padding: 10px; border: 2px dashed #999; transform: rotate(2deg); 
            z-index: 100; box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
        }
        .ticket-title { text-align: center; font-size: 14px; border-bottom: 2px solid #333; margin-bottom: 5px; }
        .ticket-item { font-size: 12px; padding: 3px 0; border-bottom: 1px solid #eee; }

        /* 效果 */
        .cake { width: 60px; height: 40px; background: #e0c097; border-radius: 6px; position: relative; }
        .baking { animation: shake 0.1s infinite; }
        @keyframes shake { 0% { transform: rotate(1deg); } 50% { transform: rotate(-1deg); } 100% { transform: rotate(1deg); } }
        
        .status-text { color: #ccc; font-size: 12px; margin-top: 10px; text-align: center; }
        .done-btn { 
            position: absolute; right: 30px; bottom: 100px; width: 80px; height: 80px; 
            border-radius: 50%; border: none; background: #2ecc71; color: white; 
            font-weight: bold; cursor: pointer; box-shadow: 0 6px 0 #27ae60;
        }
        .done-btn:active { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header">
        <span>☕ Papa's Tiramisuria</span>
        <span>Tips: <strong style="color: var(--papas-gold);">$ <span id="money">0.00</span></strong></span>
    </div>

    <div id="ticket">
        <div class="ticket-title">ORDER #1</div>
        <div id="order-list"></div>
    </div>

    <div id="bake-view" class="station active">
        <div class="oven-slot" id="slot-0" onclick="handleOven(0)">
            <div id="canvas-0" class="status-text">CLICK TO BAKE</div>
            <div class="timer-bar"><div class="perfect-zone"></div><div id="fill-0" class="timer-fill"></div></div>
        </div>
        <div class="oven-slot" id="slot-1" onclick="handleOven(1)">
            <div id="canvas-1" class="status-text">CLICK TO BAKE</div>
            <div class="timer-bar"><div class="perfect-zone"></div><div id="fill-1" class="timer-fill"></div></div>
        </div>
        <div class="oven-slot" id="slot-2" onclick="handleOven(2)">
            <div id="canvas-2" class="status-text">CLICK TO BAKE</div>
            <div class="timer-bar"><div class="perfect-zone"></div><div id="fill-2" class="timer-fill"></div></div>
        </div>
    </div>

    <div id="build-view" class="station">
        <div id="cup-area"></div>
        
        <div class="ingredient-tray">
            <button onclick="addToCup(1, '熟饼干')" class="ing-btn color-1">🍪 熟饼干</button>
            <button onclick="addToCup(2, '马斯卡彭')" class="ing-btn color-2">🍦 奶油层</button>
            <button onclick="addToCup(3, '可可粉')" class="ing-btn color-3">🍫 可可粉</button>
        </div>
        
        <button onclick="submitOrder()" class="done-btn">DONE</button>
    </div>

    <div class="nav">
        <button id="btn-bake" class="nav-btn active-btn" onclick="switchStation('bake')">BAKE STATION</button>
        <button id="btn-build" class="nav-btn" onclick="switchStation('build')">BUILD STATION</button>
    </div>
</div>

<script>
    let money = 0;
    let currentOrder = [1, 2, 1, 2, 3]; // 核心配方：饼干-奶油-饼干-奶油-粉
    let playerCup = [];
    let ovenSlots = [
        { status: 'empty', progress: 0, timer: null },
        { status: 'empty', progress: 0, timer: null },
        { status: 'empty', progress: 0, timer: null }
    ];

    const ITEMS = {1: "熟饼干", 2: "马斯卡彭", 3: "可可粉"};

    // 初始化订单
    function initOrder() {
        const list = document.getElementById('order-list');
        list.innerHTML = currentOrder.map(id => `<div class="ticket-item">● ${ITEMS[id]}</div>`).join("");
    }

    // 站切换
    function switchStation(st) {
        document.querySelectorAll('.station').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-btn'));
        document.getElementById(st + '-view').classList.add('active');
        document.getElementById('btn-' + st).classList.add('active-btn');
    }

    // 烤箱逻辑
    function handleOven(i) {
        let s = ovenSlots[i];
        let canvas = document.getElementById(`canvas-${i}`);
        let fill = document.getElementById(`fill-${i}`);
        let slotEl = document.getElementById(`slot-${i}`);

        if (s.status === 'empty') {
            // 开始烘烤
            s.status = 'baking';
            s.progress = 0;
            slotEl.classList.add('cooking');
            canvas.innerHTML = '<div class="cake baking"></div>';
            s.timer = setInterval(() => {
                s.progress += 0.5;
                fill.style.width = s.progress + '%';
                
                // 变色效果
                if(s.progress > 70) {
                    let b = 1 - (s.progress - 70) / 50;
                    canvas.querySelector('.cake').style.filter = `brightness(${b})`;
                }

                if (s.progress >= 100) {
                    clearInterval(s.timer);
                    s.status = 'burnt';
                    canvas.innerHTML = '<div class="cake" style="background:#222"></div><div style="color:red">BURNT!</div>';
                }
            }, 30);
        } else if (s.status === 'baking') {
            // 停止烘烤
            clearInterval(s.timer);
            slotEl.classList.remove('cooking');
            if (s.progress >= 75 && s.progress <= 90) {
                s.status = 'ready';
                canvas.innerHTML = '<div class="cake"></div><div style="color:gold">PERFECT!</div>';
            } else {
                s.status = 'ready';
                canvas.innerHTML = '<div class="cake"></div><div style="color:#2ecc71">OK</div>';
            }
        } else if (s.status === 'ready' || s.status === 'burnt') {
            // 取走或清理
            s.status = 'empty';
            s.progress = 0;
            fill.style.width = '0%';
            canvas.innerHTML = 'CLICK TO BAKE';
            if(s.status !== 'burnt') alert("已加入备料区！");
        }
    }

    // 组装逻辑
    function addToCup(id, name) {
        playerCup.push(id);
        const cup = document.getElementById('cup-area');
        const div = document.createElement('div');
        div.className = `layer color-${id}`;
        div.innerText = name;
        cup.appendChild(div);
    }

    // 提交判定
    function submitOrder() {
        if(playerCup.length === 0) return;

        const isMatch = JSON.stringify(playerCup) === JSON.stringify(currentOrder);
        if (isMatch) {
            money += 20.00;
            alert("🌟 完美！顾客给了 $20.00 小费！");
        } else {
            money += 5.50;
            alert("😅 做的有点乱，只拿到了 $5.50。");
        }

        document.getElementById('money').innerText = money.toFixed(2);
        playerCup = [];
        document.getElementById('cup-area').innerHTML = "";
        switchStation('bake');
    }

    initOrder();
</script>

</body>
</html>
