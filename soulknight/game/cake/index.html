<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Papa's Tiramisuria - Final Version</title>
    <style>
        :root { --papas-gold: #ffcc00; --papas-brown: #5d4037; --papas-red: #e74c3c; }
        body { font-family: 'Arial Black', sans-serif; background: #222; margin: 0; user-select: none; }
        
        #game-container { width: 800px; height: 600px; background: #f4f4f4; margin: 10px auto; position: relative; border: 10px solid #333; overflow: hidden; }

        /* 顶部栏 */
        .header { height: 40px; background: #333; color: white; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; }

        /* 工作站显示控制 */
        .station { display: none; width: 100%; height: 500px; position: relative; }
        .active { display: block; }

        /* 1. 烘烤站 (Bake Station) - 还原你发的图 */
        #bake-view { background: #555; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 30px; }
        .oven-slot {
            width: 160px; height: 100px; background: #222; border: 4px solid #888; border-radius: 8px;
            position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .timer-bar { position: absolute; bottom: -20px; width: 100%; height: 10px; background: #111; border-radius: 5px; overflow: hidden; }
        .timer-fill { width: 0%; height: 100%; background: #2ecc71; }
        .perfect-zone { position: absolute; left: 75%; width: 15%; height: 100%; background: rgba(255, 255, 255, 0.4); border: 1px solid white; }

        /* 2. 组装站 (Build Station) */
        #build-view { background: #d7ccc8; }
        #cup { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); width: 150px; height: 200px; border: 4px solid var(--papas-brown); border-top: none; display: flex; flex-direction: column-reverse; background: rgba(255,255,255,0.3); }
        .layer { width: 100%; height: 30px; border: 1px solid rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }

        /* 底部导航 */
        .nav { position: absolute; bottom: 0; width: 100%; height: 60px; background: #333; display: flex; }
        .nav-btn { flex: 1; border: none; background: #444; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .nav-btn.active-btn { background: var(--papas-gold); color: black; }

        /* 订单票据 */
        #ticket { position: absolute; top: 10px; right: 20px; width: 100px; background: white; padding: 5px; border: 2px dashed #999; transform: rotate(2deg); z-index: 100; box-shadow: 2px 2px 10px rgba(0,0,0,0.2); }
        .ticket-item { font-size: 10px; border-bottom: 1px solid #eee; margin-top: 2px; }

        /* 物品样式 */
        .cake { width: 50px; height: 30px; background: #e0c097; border-radius: 4px; }
        .baking { animation: shake 0.1s infinite; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } }
        .color-1 { background: #e0c097; } .color-2 { background: #fff9c4; } .color-3 { background: #4e342e; color: white; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header">
        <span>Papa's Tiramisuria</span>
        <span>Money: $<span id="money">0.00</span></span>
    </div>

    <div id="ticket">
        <div style="text-align:center; font-size:12px; font-weight:bold;">ORDER</div>
        <div id="order-list"></div>
    </div>

    <div id="bake-view" class="station active">
        <div class="oven-slot" onclick="handleOven(0)">
            <div id="cake-0">点击放入饼干</div>
            <div class="timer-bar"><div class="perfect-zone"></div><div id="fill-0" class="timer-fill"></div></div>
        </div>
        <div class="oven-slot" onclick="handleOven(1)">
            <div id="cake-1">点击放入饼干</div>
            <div class="timer-bar"><div class="perfect-zone"></div><div id="fill-1" class="timer-fill"></div></div>
        </div>
        <div class="oven-slot" onclick="handleOven(2)">
            <div id="cake-2">点击放入饼干</div>
            <div class="timer-bar"><div class="perfect-zone"></div><div id="fill-2" class="timer-fill"></div></div>
        </div>
    </div>

    <div id="build-view" class="station">
        <div id="cup"></div>
        <div style="position:absolute; bottom:10px; width:100%; display:flex; justify-content:center; gap:10px;">
            <button onclick="addToCup(1, '饼干')" class="color-1">🍪 熟饼干</button>
            <button onclick="addToCup(2, '奶油')" class="color-2">🍦 奶油</button>
            <button onclick="addToCup(3, '可可粉')" class="color-3">🍫 可可粉</button>
        </div>
        <button onclick="submitOrder()" style="position:absolute; right:20px; bottom:80px; padding:20px; background:#2ecc71; color:white; border:none; border-radius:50%; cursor:pointer; font-weight:bold;">完成</button>
    </div>

    <div class="nav">
        <button id="btn-bake" class="nav-btn active-btn" onclick="switchStation('bake')">BAKE STATION</button>
        <button id="btn-build" class="nav-btn" onclick="switchStation('build')">BUILD STATION</button>
    </div>
</div>

<script>
    let money = 0;
    let order = [1, 2, 1, 2, 3]; // 固定的 Linear 订单逻辑
    let playerCup = [];
    let ovenSlots = [
        { status: 'empty', progress: 0, timer: null },
        { status: 'empty', progress: 0, timer: null },
        { status: 'empty', progress: 0, timer: null }
    ];

    // 初始化订单显示
    const names = {1: "熟饼干", 2: "奶油", 3: "可可粉"};
    document.getElementById('order-list').innerHTML = order.map(id => `<div class="ticket-item">${names[id]}</div>`).join("");

    function switchStation(st) {
        document.querySelectorAll('.station').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-btn'));
        document.getElementById(st + '-view').classList.add('active');
        document.getElementById('btn-' + st).classList.add('active-btn');
    }

    // 烤箱逻辑
    function handleOven(i) {
        let s = ovenSlots[i];
        let cakeEl = document.getElementById(`cake-${i}`);
        let fillEl = document.getElementById(`fill-${i}`);

        if (s.status === 'empty') {
            s.status = 'baking';
            s.progress = 0;
            cakeEl.innerHTML = '<div class="cake baking"></div>';
            s.timer = setInterval(() => {
                s.progress += 1;
                fillEl.style.width = s.progress + '%';
                if (s.progress >= 100) {
                    clearInterval(s.timer);
                    s.status = 'burnt';
                    cakeEl.innerHTML = '🔥 烤焦了';
                }
            }, 50); 
        } else if (s.status === 'baking') {
            clearInterval(s.timer);
            if (s.progress >= 75 && s.progress <= 90) {
                s.status = 'ready';
                cakeEl.innerHTML = '<div class="cake">完美！点击取走</div>';
            } else {
                s.status = 'ready';
                cakeEl.innerHTML = '<div class="cake">一般，点击取走</div>';
            }
        } else if (s.status === 'ready' || s.status === 'burnt') {
            s.status = 'empty';
            s.progress = 0;
            fillEl.style.width = '0%';
            cakeEl.innerHTML = '点击放入饼干';
        }
    }

    // 组装逻辑
    function addToCup(id, name) {
        playerCup.push(id);
        let layer = document.createElement('div');
        layer.className = 'layer color-' + id;
        layer.innerText = name;
        document.getElementById('cup').appendChild(layer);
    }

    // 提交逻辑
    function submitOrder() {
        if (JSON.stringify(playerCup) === JSON.stringify(order)) {
            money += 20;
            alert("完美提拉米苏！获得 $20");
        } else {
            money += 5;
            alert("味道不太对... 只获得 $5");
        }
        document.getElementById('money').innerText = money.toFixed(2);
        playerCup = [];
        document.getElementById('cup').innerHTML = "";
        switchStation('bake');
    }
</script>

</body>
</html>
