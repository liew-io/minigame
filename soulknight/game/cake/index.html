<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Papa's Tiramisuria - Interactive Edition</title>
    <style>
        :root { --papas-gold: #ffcc00; --papas-orange: #f39c12; --papas-brown: #5d4037; }
        body { font-family: 'Comic Sans MS', cursive, sans-serif; background: #333; margin: 0; user-select: none; }
        
        #game-box { width: 800px; height: 600px; background: #fdf2e9; margin: 20px auto; position: relative; border: 10px solid #555; overflow: hidden; }

        /* 顶部看板 */
        .top-bar { height: 50px; background: var(--papas-brown); display: flex; align-items: center; padding: 0 20px; color: white; justify-content: space-between; }

        /* 订单票据 - 可点击交互 */
        #ticket { 
            position: absolute; top: -10px; right: 50px; width: 100px; background: #fff; 
            border: 2px solid #ddd; padding: 10px; transform: rotate(3deg); transition: 0.3s;
            cursor: pointer; z-index: 100; box-shadow: 2px 5px 15px rgba(0,0,0,0.2);
        }
        #ticket:hover { top: 0px; transform: rotate(0deg) scale(1.1); }
        .ticket-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 5px; }

        /* 工作站区域 */
        .station { width: 100%; height: 490px; position: relative; display: none; }
        .active { display: block; }

        /* 制作台：杯子与食材 */
        #build-area { background: url('https://www.transparenttextures.com/patterns/wood-pattern.png'); }
        
        .cup-target { 
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            width: 160px; height: 200px; border: 5px solid rgba(93, 64, 55, 0.8);
            border-top: none; border-radius: 0 0 20px 20px; background: rgba(255,255,255,0.4);
            display: flex; flex-direction: column-reverse; padding: 5px;
        }

        .ingredient-tray { 
            position: absolute; bottom: 10px; width: 100%; height: 80px; 
            background: rgba(0,0,0,0.1); display: flex; justify-content: center; gap: 30px; align-items: center;
        }

        .draggable-ing { 
            width: 60px; height: 60px; cursor: grab; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; font-size: 30px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2); transition: transform 0.1s;
            position: relative; z-index: 10; background: white; border: 3px solid var(--papas-brown);
        }
        .draggable-ing:active { cursor: grabbing; transform: scale(1.1); }

        /* 食材落下动画 */
        .layer-anim {
            width: 95%; height: 35px; border-radius: 5px; margin: 2px auto;
            animation: drop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; text-shadow: 1px 1px 2px #000;
        }
        @keyframes drop { from { transform: translateY(-300px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* 颜色表 */
        .color-1 { background: #e0c097; } .color-2 { background: #3e2723; } 
        .color-3 { background: #fffde7; color: #5d4037 !important; } .color-4 { background: #4e342e; }

        /* 导航 */
        .nav { position: absolute; bottom: 0; width: 100%; height: 60px; background: #444; display: flex; }
        .nav-tab { flex: 1; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; border-right: 1px solid #555; }
        .nav-tab.active-tab { background: var(--papas-orange); color: #000; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-box">
    <div class="top-bar">
        <span>💰 $ <span id="money-display">0.00</span></span>
        <span>PAPA'S TIRAMISURIA</span>
    </div>

    <div id="ticket" onclick="this.classList.toggle('expand')">
        <div style="font-size: 10px; text-align: center; font-weight: bold;">ORDER #1</div>
        <div id="order-list"></div>
    </div>

    <div id="station-order" class="station active" style="text-align: center; padding-top: 100px;">
        <div style="font-size: 100px;">👤</div>
        <button onclick="takeOrder()" style="padding: 15px 30px; font-size: 20px; background: var(--papas-orange); border: none; border-radius: 10px; cursor: pointer; margin-top: 20px;">Take Order</button>
    </div>

    <div id="station-build" class="station">
        <div class="cup-target" id="cup" ondragover="event.preventDefault()" ondrop="handleDrop(event)">
            </div>

        <div class="ingredient-tray">
            <div class="draggable-ing color-1" draggable="true" ondragstart="drag(event, 1)">🍪</div>
            <div class="draggable-ing color-2" draggable="true" ondragstart="drag(event, 2)">☕</div>
            <div class="draggable-ing color-3" draggable="true" ondragstart="drag(event, 3)">🍦</div>
            <div class="draggable-ing color-4" draggable="true" ondragstart="drag(event, 4)">🍫</div>
        </div>

        <button onclick="finishDish()" style="position: absolute; right: 20px; top: 150px; background: #2ecc71; color: white; border: none; padding: 20px; border-radius: 50%; cursor: pointer; font-weight: bold;">DONE</button>
    </div>

    <div class="nav">
        <div class="nav-tab active-tab" id="tab-order" onclick="switchStation('order')">ORDER</div>
        <div class="nav-tab" id="tab-build" onclick="switchStation('build')">BUILD</div>
    </div>
</div>

<script>
    const NAMES = {1: "Biscotti", 2: "Coffee", 3: "Mascarpone", 4: "Cocoa"};
    let order = [];
    let playerStack = [];
    let money = 0;

    // 1. 切换车站
    function switchStation(s) {
        document.querySelectorAll('.station').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active-tab'));
        document.getElementById('station-' + s).classList.add('active');
        document.getElementById('tab-' + s).classList.add('active-tab');
    }

    // 2. 接单逻辑
    function takeOrder() {
        order = [1, 2, 3, 1, 2, 3, 4]; // 经典 Linear 结构
        const list = document.getElementById('order-list');
        list.innerHTML = order.map(id => `
            <div style="font-size: 11px; margin-top: 5px;">
                <span class="ticket-dot color-${id}"></span> ${NAMES[id]}
            </div>
        `).join("");
        alert("New Order Received! Go to Build Station.");
        switchStation('build');
    }

    // 3. 拖拽交互
    function drag(ev, id) {
        ev.dataTransfer.setData("text", id);
    }

    function handleDrop(ev) {
        ev.preventDefault();
        const id = ev.dataTransfer.getData("text");
        addLayer(parseInt(id));
    }

    function addLayer(id) {
        if(order.length === 0) return;
        playerStack.push(id);
        const layer = document.createElement('div');
        layer.className = `layer-anim color-${id}`;
        layer.innerText = NAMES[id];
        document.getElementById('cup').appendChild(layer);
        
        // 播放音效感（简单的视觉反馈）
        const trayIng = document.querySelector(`.draggable-ing.color-${id}`);
        trayIng.style.transform = "scale(0.8)";
        setTimeout(() => trayIng.style.transform = "scale(1)", 100);
    }

    // 4. 判定
    function finishDish() {
        if(playerStack.length === 0) return;
        
        const isCorrect = JSON.stringify(order) === JSON.stringify(playerStack);
        if(isCorrect) {
            money += 15.50;
            alert("Perfect! 🌟 你获得了 $15.50 小费！");
        } else {
            money += 2.00;
            alert("Order is wrong... 只有 $2.00 基础费。");
        }
        
        document.getElementById('money-display').innerText = money.toFixed(2);
        resetRound();
    }

    function resetRound() {
        playerStack = [];
        order = [];
        document.getElementById('cup').innerHTML = "";
        document.getElementById('order-list').innerHTML = "";
        switchStation('order');
    }
</script>

</body>
</html>
