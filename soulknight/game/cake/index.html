<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Papa's Tiramisuria</title>
    <style>
        :root { --papas-gold: #ffcc00; --papas-brown: #5d4037; }
        body { font-family: 'Arial', sans-serif; background: #222; color: white; margin: 0; overflow: hidden; }
        
        /* 游戏主容器 */
        #game-screen { width: 800px; height: 600px; background: #f4ece1; margin: 20px auto; position: relative; border: 8px solid #444; color: #333; }
        
        /* 顶部导航栏 - 老爹系列经典设计 */
        #nav-bar { position: absolute; bottom: 0; width: 100%; height: 60px; background: #333; display: flex; justify-content: space-around; align-items: center; }
        .nav-btn { padding: 10px 25px; background: #666; color: white; cursor: pointer; border-radius: 10px 10px 0 0; border: none; font-weight: bold; }
        .nav-btn.active { background: var(--papas-gold); color: #000; }

        /* 工作站控制 */
        .station { display: none; width: 100%; height: 540px; position: relative; }
        .station.active { display: block; }

        /* 订单票据 - 灵魂所在 */
        #ticket { position: absolute; top: 10px; right: 10px; width: 120px; background: #fff; border: 1px solid #ccc; padding: 5px; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); z-index: 100; transform: rotate(2deg); }
        .ticket-item { border-bottom: 1px solid #eee; font-size: 12px; padding: 2px; }

        /* 点餐台 */
        #order-station { background: url('https://img.freepik.com/free-vector/bakery-shop-interior_23-2148532454.jpg') center/cover; }
        .customer { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); font-size: 80px; }

        /* 制作台设计 */
        .ingredient-shelf { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: center; gap: 15px; }
        .ing-btn { width: 70px; height: 70px; border-radius: 50%; border: 4px solid var(--papas-brown); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; background: white; }
        
        /* 杯子容器 */
        #cup-container { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); width: 180px; height: 220px; border: 4px solid #5d4037; border-top: none; display: flex; flex-direction: column-reverse; background: rgba(255,255,255,0.3); border-radius: 0 0 20px 20px; overflow: hidden; }
        .layer { width: 100%; height: 30px; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; transition: all 0.3s; }
        
        /* 颜色定义 */
        .ing-1 { background: #e0c097; color: #5d4037; } /* 饼干 */
        .ing-2 { background: #3e2723; color: #fff; }    /* 咖啡浸泡 */
        .ing-3 { background: #fffde7; color: #8d6e63; } /* 奶油 */
        .ing-4 { background: #4e342e; color: #fff; }    /* 可可粉 */

        /* 提示文字 */
        .hint { background: var(--papas-gold); padding: 10px; border-radius: 20px; position: absolute; top: 100px; left: 50%; transform: translateX(-50%); }
    </style>
</head>
<body>

<div id="game-screen">
    <div id="ticket" style="display:none;">
        <div style="text-align:center; font-weight:bold; border-bottom:2px solid #000;">ORDER</div>
        <div id="ticket-content"></div>
    </div>

    <div id="order-station" class="station active">
        <div class="customer" id="customer">👤</div>
        <div class="hint" id="order-hint" onclick="startOrder()">点我开始接单</div>
    </div>

    <div id="build-station" class="station">
        <div id="cup-container"></div>
        <div class="ingredient-shelf">
            <div class="ing-btn" onclick="addToCup(1)">🍪<br>饼干</div>
            <div class="ing-btn" onclick="addToCup(2)">☕<br>浸泡</div>
            <div class="ing-btn" onclick="addToCup(3)">🍦<br>奶油</div>
            <div class="ing-btn" onclick="addToCup(4)">🍫<br>可可粉</div>
        </div>
        <button onclick="submitDish()" style="position:absolute; right:20px; bottom:100px; padding:15px; background: #4caf50; color:white; border-radius: 50%; border:none; cursor:pointer;">完成订单</button>
    </div>

    <div id="nav-bar">
        <button class="nav-btn active" id="btn-order" onclick="switchStation('order')">Order Station</button>
        <button class="nav-btn" id="btn-build" onclick="switchStation('build')">Build Station</button>
    </div>
</div>

<script>
    const ITEMS = {1: "LADYFINGER", 2: "COFFEE SOAK", 3: "CREAM", 4: "COCOA"};
    let currentOrder = [];
    let playerCup = [];
    let isOrdering = false;

    // 1. 切换工作站
    function switchStation(name) {
        document.querySelectorAll('.station').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(name + '-station').classList.add('active');
        document.getElementById('btn-' + name).classList.add('active');
    }

    // 2. 接单逻辑
    function startOrder() {
        if(isOrdering) return;
        isOrdering = true;
        document.getElementById('order-hint').innerText = "正在点餐...";
        
        // 随机生成老爹风格订单 (Linear 格式)
        currentOrder = [1, 2, 3, 1, 2, 3, 4]; // 模拟固定高级配方
        setTimeout(() => {
            document.getElementById('ticket').style.display = 'block';
            const content = document.getElementById('ticket-content');
            content.innerHTML = currentOrder.map(id => `<div class="ticket-item">● ${ITEMS[id]}</div>`).join("");
            document.getElementById('order-hint').innerText = "订单已挂起，去制作台吧！";
        }, 1000);
    }

    // 3. 制作逻辑
    function addToCup(id) {
        if(!isOrdering) return alert("先去点餐台接单！");
        playerCup.push(id);
        const cup = document.getElementById('cup-container');
        const div = document.createElement('div');
        div.className = `layer ing-${id}`;
        div.innerText = ITEMS[id];
        cup.appendChild(div);
    }

    // 4. 判定与评分 (老爹系列的精髓：百分比判定)
    function submitDish() {
        if(playerCup.length === 0) return;
        
        let score = 0;
        const correct = JSON.stringify(currentOrder);
        const player = JSON.stringify(playerCup);

        if(correct === player) {
            score = 100;
            alert("Perfect! 💯 \n 顾客给了你极高的小费！");
        } else {
            score = Math.floor(Math.random() * 40) + 10;
            alert(`Oops! 得分: ${score} \n 顺序错了或者配料不对。`);
        }

        // 重置游戏状态
        resetGame();
    }

    function resetGame() {
        playerCup = [];
        currentOrder = [];
        isOrdering = false;
        document.getElementById('cup-container').innerHTML = "";
        document.getElementById('ticket').style.display = 'none';
        document.getElementById('order-hint').innerText = "点我开始接单";
        switchStation('order');
    }
</script>

</body>
</html>
