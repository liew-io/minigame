<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>进阶版贪吃蛇</title>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* 防止手机端滑动 */
        }
        canvas {
            background-color: #000;
            border: 4px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            max-width: 90vw; /* 适配手机宽度 */
            max-height: 50vh;
            margin-top: 20px;
        }
        .stats {
            font-size: 20px;
            margin: 10px;
            color: #38bdf8;
        }
        /* 手机虚拟按键样式 */
        .controls {
            display: grid;
            grid-template-areas: 
                ". up ."
                "left down right";
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            width: 60px;
            height: 60px;
            background: rgba(56, 189, 248, 0.2);
            border: 2px solid #38bdf8;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: white;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { background: #38bdf8; }
        .up { grid-area: up; }
        .left { grid-area: left; }
        .right { grid-area: right; }
        .down { grid-area: down; }
        
        @media (min-width: 768px) {
            .controls { display: none; } /* 电脑端隐藏按键 */
        }
    </style>
</head>
<body>

    <div class="stats">得分: <span id="score">0</span> | 速度: <span id="speed">1</span></div>
    <canvas id="game" width="400" height="400"></canvas>

    <div class="controls">
        <div class="btn up" onclick="setDir('UP')">▲</div>
        <div class="btn left" onclick="setDir('LEFT')">◀</div>
        <div class="btn right" onclick="setDir('RIGHT')">▶</div>
        <div class="btn down" onclick="setDir('DOWN')">▼</div>
    </div>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const scoreBox = document.getElementById("score");
        const speedBox = document.getElementById("speed");

        const box = 20;
        let snake = [{x: 10 * box, y: 10 * box}];
        let food = { x: 5*box, y: 5*box };
        let d = "RIGHT";
        let score = 0;
        let gameSpeed = 150; // 初始速度（毫秒）
        let gameLoop;

        // 随机食物
        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * 19 + 1) * box,
                y: Math.floor(Math.random() * 19 + 1) * box
            };
        }

        // 方向控制（兼容电脑键盘）
        document.addEventListener("keydown", (e) => {
            if(e.keyCode == 37 && d != "RIGHT") d = "LEFT";
            if(e.keyCode == 38 && d != "DOWN") d = "UP";
            if(e.keyCode == 39 && d != "LEFT") d = "RIGHT";
            if(e.keyCode == 40 && d != "UP") d = "DOWN";
        });

        // 方向控制（兼容手机点击）
        function setDir(dir) {
            if(dir == "LEFT" && d != "RIGHT") d = "LEFT";
            if(dir == "UP" && d != "DOWN") d = "UP";
            if(dir == "RIGHT" && d != "LEFT") d = "RIGHT";
            if(dir == "DOWN" && d != "UP") d = "DOWN";
        }

        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 画蛇
            snake.forEach((unit, index) => {
                ctx.fillStyle = (index == 0) ? "#38bdf8" : "#1e293b";
                ctx.fillRect(unit.x, unit.y, box, box);
                ctx.strokeStyle = "black";
                ctx.strokeRect(unit.x, unit.y, box, box);
            });

            // 画食物
            ctx.fillStyle = "#fb7185";
            ctx.fillRect(food.x, food.y, box, box);

            let headX = snake[0].x;
            let headY = snake[0].y;

            if(d == "LEFT") headX -= box;
            if(d == "UP") headY -= box;
            if(d == "RIGHT") headX += box;
            if(d == "DOWN") headY += box;

            // 吃到食物
            if(headX == food.x && headY == food.y) {
                score++;
                scoreBox.innerText = score;
                spawnFood();
                increaseSpeed(); // 速度加快
            } else {
                snake.pop();
            }

            let newHead = {x: headX, y: headY};

            // 死亡判断
            if(headX < 0 || headX >= canvas.width || headY < 0 || headY >= canvas.height || collision(newHead, snake)) {
                alert("GAME OVER! 分数: " + score);
                location.reload();
                return;
            }

            snake.unshift(newHead);
        }

        function collision(head, array) {
            return array.some(s => s.x == head.x && s.y == head.y);
        }

        // 核心：动态调整速度
        function increaseSpeed() {
            clearInterval(gameLoop);
            // 每次吃食物，间隔减少 2ms，最快到 50ms
            gameSpeed = Math.max(50, 150 - (score * 2)); 
            speedBox.innerText = Math.floor(1000/gameSpeed);
            gameLoop = setInterval(draw, gameSpeed);
        }

        // 启动游戏
        spawnFood();
        gameLoop = setInterval(draw, gameSpeed);
    </script>
</body>
</html>
