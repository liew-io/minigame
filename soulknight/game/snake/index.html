<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>元气蛇：全服竞技版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background-color: #0b0f1a; color: #fff; font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; overflow-x: hidden; touch-action: none; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; width: 100%; max-width: 1000px; }
        .game-box { display: flex; flex-direction: column; align-items: center; }
        .stats { padding: 10px; font-size: 16px; font-weight: bold; color: #4ade80; text-align: center; }
        .user-info { font-size: 14px; color: #fbbf24; margin-bottom: 5px; }
        canvas { background-color: #000; border: 3px solid #334155; display: block; width: 320px; height: 320px; border-radius: 8px; box-shadow: 0 0 20px rgba(74, 222, 128, 0.2); }
        
        .leaderboard { width: 280px; background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .leaderboard h2 { margin: 0 0 15px 0; font-size: 20px; color: #fbbf24; text-align: center; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .rank-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #334155; font-size: 14px; }
        .rank-name { color: #e2e8f0; font-weight: 500; }
        .rank-score { color: #4ade80; font-weight: bold; }

        .controls { display: grid; grid-template-areas: ". up ." "left down right"; gap: 12px; margin-top: 20px; }
        .btn { width: 70px; height: 70px; background: #1e293b; border: 2px solid #475569; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; color: #94a3b8; user-select: none; -webkit-tap-highlight-color: transparent; }
        .btn:active { background: #4ade80; color: #000; transform: scale(0.9); }
        .up { grid-area: up; } .left { grid-area: left; } .right { grid-area: right; } .down { grid-area: down; }
        
        @media (max-width: 650px) { .container { flex-direction: column; align-items: center; } .leaderboard { width: 320px; } }
    </style>
</head>
<body>

<div class="container">
    <div class="game-box">
        <div class="user-info">当前玩家: <span id="playerNameDisplay">未登录</span></div>
        <div class="stats">SCORE: <span id="score">0</span> | BEST: <span id="highScore">0</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <div class="btn up" onpointerdown="setDir('UP')">▲</div>
            <div class="btn left" onpointerdown="setDir('LEFT')">◀</div>
            <div class="btn right" onpointerdown="setDir('RIGHT')">▶</div>
            <div class="btn down" onpointerdown="setDir('DOWN')">▼</div>
        </div>
    </div>

    <div class="leaderboard">
        <h2>🏆 全服英雄榜</h2>
        <div id="rankList">努力加载中...</div>
    </div>
</div>

<script>
    // 1. 初始化
    const SB_URL = 'https://zyltashytubjqqysjjyt.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5bHRhc2h5dHVianFxeXNqanl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMzk2NTksImV4cCI6MjA5MjcxNTY1OX0.Y7OlxY9H3wb99-F3K4cvrExxhXPNfKUtPj0t4pMCLuE';
    const dbClient = supabase.createClient(SB_URL, SB_KEY);

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("highScore");
    const nameDisplay = document.getElementById("playerNameDisplay");

    // --- 玩家持久化逻辑 ---
    let currentPlayerName = localStorage.getItem("snake_player_name");

    function initUser() {
        if (!currentPlayerName) {
            currentPlayerName = prompt("欢迎来到元气蛇！请输入你的游戏昵称（输入后将永久使用）：", "新玩家");
            if (!currentPlayerName || currentPlayerName.trim() === "") {
                currentPlayerName = "匿名玩家" + Math.floor(Math.random() * 1000);
            }
            localStorage.setItem("snake_player_name", currentPlayerName);
        }
        nameDisplay.innerText = currentPlayerName;
    }

    const gridSize = 20;
    const tileCount = 20;
    let snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
    let food = {x: 5, y: 5};
    let currentDir = "UP", nextDir = "UP", score = 0, lastRenderTime = 0;
    let localBest = localStorage.getItem("snake_max_score") || 0;
    highScoreEl.innerText = localBest;

    // --- 数据库逻辑 ---
    async function fetchLeaderboard() {
        try {
            const { data } = await dbClient
                .from('leaderboard')
                .select('name, score')
                .order('score', { ascending: false })
                .limit(10);
            if (data) {
                document.getElementById("rankList").innerHTML = data.map((item, i) => `
                    <div class="rank-item">
                        <span class="rank-name">${i+1}. ${item.name}</span>
                        <span class="rank-score">${item.score}</span>
                    </div>
                `).join('');
            }
        } catch (e) { console.error(e); }
    }

    async function submitScore(finalScore) {
        // 直接使用已存的名字，不再弹出输入框
        try {
            const { data: existingEntry } = await dbClient
                .from('leaderboard')
                .select('score')
                .eq('name', currentPlayerName)
                .maybeSingle();

            if (existingEntry) {
                if (finalScore > existingEntry.score) {
                    await dbClient.from('leaderboard').update({ score: finalScore }).eq('name', currentPlayerName);
                }
            } else {
                await dbClient.from('leaderboard').insert([{ name: currentPlayerName, score: finalScore }]);
            }
            fetchLeaderboard();
        } catch (e) { console.error(e); }
    }

    // --- 游戏核心 ---
    function setDir(dir) {
        if (dir === "UP" && currentDir !== "DOWN") nextDir = "UP";
        if (dir === "DOWN" && currentDir !== "UP") nextDir = "DOWN";
        if (dir === "LEFT" && currentDir !== "RIGHT") nextDir = "LEFT";
        if (dir === "RIGHT" && currentDir !== "LEFT") nextDir = "RIGHT";
    }

    function update() {
        currentDir = nextDir;
        let dx = 0, dy = 0;
        if (currentDir === "UP") dy = -1; 
        else if (currentDir === "DOWN") dy = 1; 
        else if (currentDir === "LEFT") dx = -1; 
        else if (currentDir === "RIGHT") dx = 1;

        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || 
            snake.some((s, i) => i !== 0 && s.x === head.x && s.y === head.y)) {
            const finalScore = score;
            gameOver();
            submitScore(finalScore);
            return;
        }

        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
            score++;
            scoreEl.innerText = score;
            if (score > localBest) {
                localBest = score;
                localStorage.setItem("snake_max_score", localBest);
                highScoreEl.innerText = localBest;
            }
            generateFood();
        } else { snake.pop(); }
    }

    function draw() {
        ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fb7185"; ctx.beginPath(); ctx.roundRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4, 5); ctx.fill();
        snake.forEach((part, i) => {
            ctx.fillStyle = i === 0 ? "#4ade80" : "#1e293b";
            ctx.beginPath(); ctx.roundRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2, i === 0 ? 6 : 2); ctx.fill();
        });
    }

    function gameOver() {
        score = 0; scoreEl.innerText = "0";
        snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
        nextDir = "UP"; currentDir = "UP";
        generateFood();
    }

    function generateFood() {
        food = { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };
        if (snake.some(s => s.x === food.x && s.y === food.y)) generateFood();
    }

    function main(currentTime) {
        window.requestAnimationFrame(main);
        const speed = 7 + Math.floor(score / 3);
        if ((currentTime - lastRenderTime) / 1000 < 1 / speed) return;
        lastRenderTime = currentTime;
        update();
        draw();
    }

    document.onkeydown = (e) => {
        if (e.key === "ArrowUp") setDir("UP");
        if (e.key === "ArrowDown") setDir("DOWN");
        if (e.key === "ArrowLeft") setDir("LEFT");
        if (e.key === "ArrowRight") setDir("RIGHT");
    };

    // 启动顺序：初始化用户 -> 加载排行 -> 开始循环
    initUser();
    generateFood();
    fetchLeaderboard();
    window.requestAnimationFrame(main);
</script>
</body>
</html>
