<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>元气蛇：全服竞技版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background-color: #0b0f1a; color: #fff; font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; overflow-x: hidden; touch-action: none; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; width: 100%; max-width: 1000px; }
        .game-box { display: flex; flex-direction: column; align-items: center; }
        .stats { padding: 10px; font-size: 18px; font-weight: bold; color: #4ade80; text-align: center; }
        canvas { background-color: #000; border: 3px solid #334155; display: block; width: 320px; height: 320px; border-radius: 8px; box-shadow: 0 0 20px rgba(74, 222, 128, 0.2); }
        
        /* 排行榜样式 */
        .leaderboard { width: 280px; background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .leaderboard h2 { margin: 0 0 15px 0; font-size: 20px; color: #fbbf24; text-align: center; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .rank-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #334155; font-size: 14px; transition: 0.3s; }
        .rank-item:hover { background: rgba(255,255,255,0.05); }
        .rank-name { color: #e2e8f0; font-weight: 500; }
        .rank-score { color: #4ade80; font-weight: bold; }

        .controls { display: grid; grid-template-areas: ". up ." "left down right"; gap: 12px; margin-top: 20px; }
        .btn { width: 70px; height: 70px; background: #1e293b; border: 2px solid #475569; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; color: #94a3b8; user-select: none; -webkit-tap-highlight-color: transparent; }
        .btn:active { background: #4ade80; color: #000; transform: scale(0.9); }
        .up { grid-area: up; } .left { grid-area: left; } .right { grid-area: right; } .down { grid-area: down; }
        
        @media (max-width: 650px) { .container { flex-direction: column; align-items: center; } .leaderboard { width: 320px; } }
    </style>
</head>
<body>

<div class="container">
    <div class="game-box">
        <div class="stats">SCORE: <span id="score">0</span> | BEST: <span id="highScore">0</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <div class="btn up" onpointerdown="setDir('UP')">▲</div>
            <div class="btn left" onpointerdown="setDir('LEFT')">◀</div>
            <div class="btn right" onpointerdown="setDir('RIGHT')">▶</div>
            <div class="btn down" onpointerdown="setDir('DOWN')">▼</div>
        </div>
    </div>

    <div class="leaderboard">
        <h2>🏆 全服英雄榜</h2>
        <div id="rankList">努力加载中...</div>
    </div>
</div>


    
</body>
</html>
