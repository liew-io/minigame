<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>元气蛇：终极丝滑版</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0f1a;
            color: #fff;
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            touch-action: none; /* 核心：防止手机端误触缩放或滚动 */
        }
        .stats {
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #4ade80;
            text-shadow: 0 0 5px rgba(74, 222, 128, 0.5);
        }
        canvas {
            background-color: #000;
            border: 3px solid #334155;
            display: block;
            width: 340px; /* 适配大部分手机屏幕 */
            height: 340px;
            image-rendering: pixelated; /* 保持像素感 */
        }
        .controls {
            display: grid;
            grid-template-areas: 
                ". up ."
                "left down right";
            gap: 12px;
            margin-top: 20px;
        }
        .btn {
            width: 75px;
            height: 75px;
            background: #1e293b;
            border: 2px solid #475569;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: #94a3b8;
            /* 关键：使用 pointer 事件减少延迟 */
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            background: #334155;
            border-color: #4ade80;
            color: #4ade80;
            transform: scale(0.92);
        }
        .up { grid-area: up; }
        .left { grid-area: left; }
        .right { grid-area: right; }
        .down { grid-area: down; }
        
        @media (min-width: 768px) {
            .controls { display: none; }
        }
    </style>
</head>
<body>

    <div class="stats">SCORE: <span id="score">0</span> | SPEED: <span id="speed">1</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls">
        <div class="btn up" onpointerdown="setDir('UP')">▲</div>
        <div class="btn left" onpointerdown="setDir('LEFT')">◀</div>
        <div class="btn right" onpointerdown="setDir('RIGHT')">▶</div>
        <div class="btn down" onpointerdown="setDir('DOWN')">▼</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const speedEl = document.getElementById("speed");

        const gridSize = 20;
        const tileCount = 20;

        let snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
        let food = {x: 5, y: 5};
        
        let currentDir = "UP"; // 蛇当前真正在移动的方向
        let nextDir = "UP";    // 玩家指令缓存（下一帧生效）
        
        let score = 0;
        let lastRenderTime = 0;
        let baseSpeed = 7; // 初始每秒移动 7 格

        function main(currentTime) {
            window.requestAnimationFrame(main);
            
            // 计算动态速度：每得 2 分，速度增加 1，最高 22
            const currentSpeed = Math.min(22, baseSpeed + Math.floor(score / 2));
            speedEl.innerText = Math.floor(currentSpeed - 6);

            const secondsSinceLastRender = (currentTime - lastRenderTime) / 1000;
            if (secondsSinceLastRender < 1 / currentSpeed) return;

            lastRenderTime = currentTime;
            update();
            draw();
        }

        // 核心逻辑：防止反向自杀的方向控制
        function setDir(dir) {
            if (dir === "UP" && currentDir !== "DOWN") nextDir = "UP";
            if (dir === "DOWN" && currentDir !== "UP") nextDir = "DOWN";
            if (dir === "LEFT" && currentDir !== "RIGHT") nextDir = "LEFT";
            if (dir === "RIGHT" && currentDir !== "LEFT") nextDir = "RIGHT";
        }

        function update() {
            // 在更新逻辑时，正式确认方向
            currentDir = nextDir;

            let dx = 0, dy = 0;
            if (currentDir === "UP") dy = -1;
            if (currentDir === "DOWN") dy = 1;
            if (currentDir === "LEFT") dx = -1;
            if (currentDir === "RIGHT") dx = 1;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 死亡检测：撞墙或撞自己
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || 
                snake.some((s, index) => index !== 0 && s.x === head.x && s.y === head.y)) {
                alert("游戏结束！得分: " + score);
                resetGame();
                return;
            }

            snake.unshift(head);

            // 吃到食物
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreEl.innerText = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            // 防止食物刷在蛇身上
            if (snake.some(s => s.x === food.x && s.y === food.y)) generateFood();
        }

        function draw() {
            // 背景
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 食物
            ctx.fillStyle = "#fb7185";
            ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);

            // 蛇
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#4ade80" : "#1e293b";
                // 蛇身稍微留一点缝隙，看起来更有节段感
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });
        }

        function resetGame() {
            snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
            nextDir = "UP";
            currentDir = "UP";
            score = 0;
            scoreEl.innerText = "0";
            generateFood();
        }

        // 键盘监听
        document.addEventListener("keydown", e => {
            switch(e.key) {
                case "ArrowUp": setDir("UP"); break;
                case "ArrowDown": setDir("DOWN"); break;
                case "ArrowLeft": setDir("LEFT"); break;
                case "ArrowRight": setDir("RIGHT"); break;
            }
        });

        // 启动
        generateFood();
        window.requestAnimationFrame(main);
    </script>
</body>
</html>
