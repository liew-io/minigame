<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>极速流畅版贪吃蛇</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0f1a;
            color: #fff;
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            touch-action: none; /* 禁用系统缩放手势，减少卡顿 */
        }
        .stats {
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #4ade80;
        }
        canvas {
            background-color: #000;
            border: 2px solid #334155;
            display: block;
            width: 320px; /* 适配主流手机 */
            height: 320px;
        }
        /* 虚拟按键优化 */
        .controls {
            display: grid;
            grid-template-areas: 
                ". up ."
                "left down right";
            gap: 15px;
            margin-top: 25px;
        }
        .btn {
            width: 70px;
            height: 70px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { background: #334155; transform: scale(0.95); }
        .up { grid-area: up; } .left { grid-area: left; }
        .right { grid-area: right; } .down { grid-area: down; }
        
        @media (min-width: 768px) { .controls { display: none; } }
    </style>
</head>
<body>

    <div class="stats">SCORE: <span id="score">0</span> | LEVEL: <span id="level">1</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls">
        <div class="btn up" onpointerdown="setDir('UP')">▲</div>
        <div class="btn left" onpointerdown="setDir('LEFT')">◀</div>
        <div class="btn right" onpointerdown="setDir('RIGHT')">▶</div>
        <div class="btn down" onpointerdown="setDir('DOWN')">▼</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const levelEl = document.getElementById("level");

        const gridSize = 20;
        const tileCount = 20;

        let snake = [{x: 10, y: 10}];
        let food = {x: 5, y: 5};
        let dx = 1, dy = 0; // 初始向右移动
        let nextDir = "RIGHT";
        let score = 0;
        
        // 控制移动频率的变量
        let lastRenderTime = 0;
        let baseSpeed = 8; // 每秒移动多少次

        function main(currentTime) {
            window.requestAnimationFrame(main);
            const secondsSinceLastRender = (currentTime - lastRenderTime) / 1000;
            
            // 根据得分动态增加速度：初始每秒8格，最高20格
            const currentSpeed = Math.min(20, baseSpeed + Math.floor(score / 3));
            levelEl.innerText = Math.floor(currentSpeed - 7);

            if (secondsSinceLastRender < 1 / currentSpeed) return;

            lastRenderTime = currentTime;
            update();
            draw();
        }

        function setDir(dir) {
            if (dir === "UP" && nextDir !== "DOWN") nextDir = "UP";
            if (dir === "DOWN" && nextDir !== "UP") nextDir = "DOWN";
            if (dir === "LEFT" && nextDir !== "RIGHT") nextDir = "LEFT";
            if (dir === "RIGHT" && nextDir !== "LEFT") nextDir = "RIGHT";
        }

        function update() {
            // 更新方向
            if (nextDir === "UP") { dx = 0; dy = -1; }
            if (nextDir === "DOWN") { dx = 0; dy = 1; }
            if (nextDir === "LEFT") { dx = -1; dy = 0; }
            if (nextDir === "RIGHT") { dx = 1; dy = 0; }

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 撞墙或撞自己判定
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || snake.some(s => s.x === head.x && s.y === head.y)) {
                alert("GAME OVER! 分数: " + score);
                snake = [{x: 10, y: 10}];
                nextDir = "RIGHT";
                score = 0;
                scoreEl.innerText = "0";
                return;
            }

            snake.unshift(head);

            // 吃到食物
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreEl.innerText = score;
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } else {
                snake.pop();
            }
        }

        function draw() {
            // 清空画布
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 画食物
            ctx.fillStyle = "#f43f5e";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

            // 画蛇
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#4ade80" : "#1e293b";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        // 键盘监听（电脑玩家）
        document.addEventListener("keydown", e => {
            if (e.key === "ArrowUp") setDir("UP");
            if (e.key === "ArrowDown") setDir("DOWN");
            if (e.key === "ArrowLeft") setDir("LEFT");
            if (e.key === "ArrowRight") setDir("RIGHT");
        });

        window.requestAnimationFrame(main);
    </script>
</body>
</html>
