<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>流体版贪吃蛇</title>
    <style>
        body { margin: 0; background: #0b0f1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; overflow: hidden; touch-action: none; }
        .stats { padding: 15px; font-size: 20px; color: #4ade80; font-weight: bold; }
        canvas { background: #000; border: 2px solid #334155; width: 340px; height: 340px; border-radius: 8px; }
        .controls { display: grid; grid-template-areas: ". up ." "left down right"; gap: 15px; margin-top: 25px; }
        .btn { width: 70px; height: 70px; background: #1e293b; border: 2px solid #475569; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; user-select: none; -webkit-tap-highlight-color: transparent; }
        .btn:active { background: #4ade80; color: #000; transform: scale(0.9); }
        .up { grid-area: up; } .left { grid-area: left; } .right { grid-area: right; } .down { grid-area: down; }
        @media (min-width: 768px) { .controls { display: none; } }
    </style>
</head>
<body>
    <div class="stats">SCORE: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls">
        <div class="btn up" onpointerdown="handleInput('UP')">▲</div>
        <div class="btn left" onpointerdown="handleInput('LEFT')">◀</div>
        <div class="btn right" onpointerdown="handleInput('RIGHT')">▶</div>
        <div class="btn down" onpointerdown="handleInput('DOWN')">▼</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");

        const GRID_SIZE = 20;
        let snake = [{x: 200, y: 200}, {x: 200, y: 220}, {x: 200, y: 240}];
        let food = {x: 100, y: 100};
        let direction = {x: 0, y: -GRID_SIZE}; 
        let score = 0;
        let moveBuffer = 0;
        let lastTime = 0;

        // 核心参数：控制速度 (每秒走的格子数)
        let speed = 7; 

        function handleInput(cmd) {
            const opposite = { 'UP':'DOWN', 'DOWN':'UP', 'LEFT':'RIGHT', 'RIGHT':'LEFT' };
            const currentKey = getCurrentKey();

            // 如果按了反方向：执行“反转蛇身”黑科技，让你直接掉头
            if (cmd === opposite[currentKey]) {
                snake.reverse();
            }
            
            // 设置新方向
            if (cmd === 'UP')    direction = {x: 0, y: -GRID_SIZE};
            if (cmd === 'DOWN')  direction = {x: 0, y: GRID_SIZE};
            if (cmd === 'LEFT')  direction = {x: -GRID_SIZE, y: 0};
            if (cmd === 'RIGHT') direction = {x: GRID_SIZE, y: 0};
        }

        function getCurrentKey() {
            if (direction.y < 0) return 'UP';
            if (direction.y > 0) return 'DOWN';
            if (direction.x < 0) return 'LEFT';
            return 'RIGHT';
        }

        function update(delta) {
            moveBuffer += delta;
            const moveInterval = 1000 / (speed + Math.floor(score/2));

            if (moveBuffer >= moveInterval) {
                const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

                // 边界穿透 (让手感更自由，撞墙不直接死，而是从另一边出来，或者你可以改回死亡逻辑)
                if (head.x < 0) head.x = canvas.width - GRID_SIZE;
                if (head.x >= canvas.width) head.x = 0;
                if (head.y < 0) head.y = canvas.height - GRID_SIZE;
                if (head.y >= canvas.height) head.y = 0;

                // 撞自己检测
                if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                    score = 0; scoreEl.innerText = "0";
                    snake = [{x: 200, y: 200}, {x: 200, y: 220}];
                    return;
                }

                snake.unshift(head);

                // 吃到食物
                if (Math.abs(head.x - food.x) < 5 && Math.abs(head.y - food.y) < 5) {
                    score++;
                    scoreEl.innerText = score;
                    food = {
                        x: Math.floor(Math.random() * (canvas.width/GRID_SIZE)) * GRID_SIZE,
                        y: Math.floor(Math.random() * (canvas.height/GRID_SIZE)) * GRID_SIZE
                    };
                } else {
                    snake.pop();
                }
                moveBuffer -= moveInterval;
            }
        }

        function draw() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 画食物
            ctx.fillStyle = "#f43f5e";
            ctx.beginPath();
            ctx.arc(food.x + GRID_SIZE/2, food.y + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI*2);
            ctx.fill();

            // 画蛇 (顺滑感核心：给蛇身加圆角和渐变)
            snake.forEach((part, i) => {
                ctx.fillStyle = i === 0 ? "#4ade80" : "#334155";
                const r = i === 0 ? 8 : 4; // 头圆一点，身子方一点
                drawRoundedRect(part.x + 1, part.y + 1, GRID_SIZE - 2, GRID_SIZE - 2, r);
            });
        }

        function drawRoundedRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.fill();
        }

        function loop(time) {
            const delta = time - lastTime;
            lastTime = time;
            update(delta);
            draw();
            requestAnimationFrame(loop);
        }

        // 键盘监听
        document.addEventListener("keydown", e => {
            if (e.key === "ArrowUp") handleInput('UP');
            if (e.key === "ArrowDown") handleInput('DOWN');
            if (e.key === "ArrowLeft") handleInput('LEFT');
            if (e.key === "ArrowRight") handleInput('RIGHT');
        });

        requestAnimationFrame(loop);
    </script>
</body>
</html>
